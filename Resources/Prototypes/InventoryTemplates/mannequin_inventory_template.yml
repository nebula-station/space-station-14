- type: inventoryTemplate
  id: mannequin
  slots:
    - name: jumpsuit
      slotTexture: uniform
      slotFlags: INNERCLOTHING
      stripTime: 3
      uiWindowPos: 0,1
      strippingWindowPos: 1,2
      displayName: Jumpsuit
    - name: outerClothing
      slotTexture: suit
      slotFlags: OUTERCLOTHING
      stripTime: 3
      uiWindowPos: 1,1
      strippingWindowPos: 2,2
      displayName: Suit
    - name: neck
      slotTexture: neck
      slotFlags: NECK
      stripTime: 3
      uiWindowPos: 0,2
      strippingWindowPos: 0,1
      displayName: Neck
    - name: mask
      stripTime: 3
      slotTexture: mask
      slotFlags: MASK
      uiWindowPos: 1,2
      strippingWindowPos: 1,1
      displayName: Mask
    - name: eyes
      slotTexture: glasses
      slotFlags: EYES
      stripTime: 3
      uiWindowPos: 0,3
      strippingWindowPos: 0,0
      displayName: Eyes
    - name: head
      slotTexture: head
      slotFlags: HEAD
      stripTime: 3
      uiWindowPos: 1,3
      strippingWindowPos: 1,0
      displayName: Head
    - name: suitstorage
      slotTexture: suit_storage
      slotFlags:   SUITSTORAGE
      slotGroup: MainHotbar
      stripTime: 3
      uiWindowPos: 2,0
      strippingWindowPos: 1,3
      dependsOn: outerClothing
      dependsOnComponents:
      - type: AllowSuitStorage
      displayName: Suit Storage
    - name: back
      slotTexture: back
      fullTextureName: template_small
      slotFlags: BACK
      stripTime: 3
      uiWindowPos: 3,0
      strippingWindowPos: 0,2
      displayName: Back
    # Lua start
    - name: finger
      slotTexture: finger
      slotFlags: FINGER
      stripTime: 2
      uiWindowPos: 2.0,3.5
      strippingWindowPos: 2,0
      displayName: Finger
    - name: necklace
      slotTexture: necklace
      slotFlags: NECKLACE
      stripTime: 2
      uiWindowPos: 2.5,3.5
      strippingWindowPos: 2,1
      displayName: Necklace
    - name: socks
      slotTexture: socks
      slotFlags: SOCKS
      stripTime: 6
      uiWindowPos: 2,0
      strippingWindowPos: 0,4
      displayName: Socks
      stripHidden: true
    - name: underwearb
      slotTexture: underwearb
      slotFlags: UNDERWEARB
      stripTime: 6
      uiWindowPos: 2,0.5
      strippingWindowPos: 1,4
      displayName: Panties
      stripHidden: true
    - name: underweart
      slotTexture: underweart
      slotFlags: UNDERWEART
      stripTime: 6
      uiWindowPos: 2.5,0.5
      strippingWindowPos: 2,4
      displayName: Bra
      stripHidden: true
    - name: wallet
      slotTexture: wallet
      slotFlags: WALLET
      stripTime: 6
      uiWindowPos: 2.5,0
      strippingWindowPos: 2,3
      dependsOn: jumpsuit
      displayName: Wallet
    - name: rightarmband
      slotTexture: armband_right
      slotFlags: ARMBANDRIGHT
      stripTime: 6
      uiWindowPos: 2.5,3
      strippingWindowPos: 3,1
      displayName: Right_armband
    - name: leftarmband
      slotTexture: armband_left
      slotFlags: ARMBANDLEFT
      stripTime: 6
      uiWindowPos: 2,3
      strippingWindowPos: 3,0
      displayName: Left_armband
    # Lua end

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceShadowkin
  categories: [ HideSpawnMenu ]
  name: shadowkin appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganShadowkinTorso
      Head: OrganShadowkinHead
      Tail: OrganShadowkinTail
      ArmLeft: OrganShadowkinArmLeft
      ArmRight: OrganShadowkinArmRight
      HandRight: OrganShadowkinHandRight
      HandLeft: OrganShadowkinHandLeft
      LegLeft: OrganShadowkinLegLeft
      LegRight: OrganShadowkinLegRight
      FootLeft: OrganShadowkinFootLeft
      FootRight: OrganShadowkinFootRight
      Brain: OrganShadowkinBrain
      Eyes: OrganShadowkinEyes
      Tongue: OrganShadowkinTongue
      Appendix: OrganShadowkinAppendix
      Ears: OrganShadowkinEars
      Lungs: OrganShadowkinLungs
      Heart: OrganShadowkinHeart
      Stomach: OrganShadowkinStomach
      Liver: OrganShadowkinLiver
      Kidneys: OrganShadowkinKidneys
  - type: HumanoidProfile
    species: Shadowkin

- type: entity
  parent:
  - AppearanceShadowkin
  - BaseSpeciesMobOrganic
  id: MobShadowkin
  name: Urist McShadow
  components:
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - Marish
    understands:
    - TauCetiBasic
    - Marish
  - type: PassiveDamage
    allowedStates:
    - Alive
    damageCap: 20
    damage:
      types:
        Heat: -0.07
        Blunt: -0.0233
        Slash: -0.0233
        Piercing: -0.0233
  - type: ThermalRegulator
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 500
    sweatHeatRegulation: 2000
    shiveringHeatRegulation: 2000
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 2
  - type: Flammable
    damage:
      types:
        Heat: 1.5
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.35
  - type: Bloodstream
    bloodlossDamage:
      types:
        Bloodloss: 1
    bloodlossHealDamage:
      types:
        Bloodloss: -0.25
    bloodReferenceSolution:
      reagents:
      - ReagentId: BlackBlood
        Quantity: 200
  - type: Puller
    needsHands: false
  - type: TemperatureDamage
    heatDamageThreshold: 330
    coldDamageThreshold: 195
    coldDamage:
      types:
        Cold: 0.05
    heatDamage:
      types:
        Heat: 0.25
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 130
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Vocal
    emoteSounds: MaleShadowkin
  - type: TypingIndicator
    proto: alien
  - type: Speech
    allowedEmotes: [ 'Mars', 'Wurble' ]
  - type: CollectiveMind
    defaultChannel: Empathy
    channels:
    - Empathy
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - AnomalyHost
    - ShadowkinEmotes
  - type: Respirator
    updateInterval: 6
    maxSaturation: 30
    saturation: 30
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5


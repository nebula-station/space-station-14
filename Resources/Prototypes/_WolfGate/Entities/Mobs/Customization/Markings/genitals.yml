# Ported from WolfGate by Nebula.
# Genital shapes from the WolfGate anatomy creator as torso markings. The art is picked per size step and,
# for groups with an artTone, from the skin-toned "_s" variant that matches the human body sprites.

# Breasts always follow the skin colour: the front on the Breasts layer, the part behind the body on BreastsBehind.
- type: marking
  id: GenitalBreastsPair
  bodyPart: Breasts
  forcedColoring: true
  childMarkingsSuffix: [ Behind ]
  coloring:
    default:
      type:
        !type:SkinColoring
  sizedStates:
    steps: [ a, b, c, d, e, f, g, h, i, j, k, l, m, n, o, huge, massive, giga, impossible ]
    default: 2
    states: [ "breasts_pair_{size}{tone}_0_FRONT" ]
  sprites:
  - sprite: _WolfGate/Mobs/Customization/Genitals/breasts.rsi
    state: breasts_pair_c_0_FRONT


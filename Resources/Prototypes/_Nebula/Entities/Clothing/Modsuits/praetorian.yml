- type: entity
  abstract: true
  id: BaseModsuitPiecePraetorian
  components:
  - type: Sprite
    sprite: _EinsteinEngines/Clothing/NanoTrasen/Modsuits/praetorian.rsi

- type: entity
  parent: [ ClothingModsuitStandard, BaseCentcommContraband, BaseModsuitPiecePraetorian ]
  id: ClothingModsuitPraetorian
  name: Praetorian modsuit control unit
  description: The main controller for a Praetorian modsuit.
  components:
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingModsuitHelmetPraetorian
      gloves: ClothingModsuitGauntletsPraetorian
      outerClothing: ClothingModsuitChestplatePraetorian
      shoes: ClothingModsuitBootsPraetorian
  - type: ContainerFill
    containers:
      cell_slot:
      - PowerCellHigh
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1

- type: entity
  parent: [ ClothingModsuitGauntletsStandard, BaseModsuitPiecePraetorian ]
  id: ClothingModsuitGauntletsPraetorian
  name: Praetorian modsuit gauntlets
  description: A pair of gauntlets made for the Praetorian modsuit.
  categories: [ HideSpawnMenu ]
  components:
  - type: Insulated

- type: entity
  parent: [ ClothingModsuitHelmetStandard, BaseModsuitPiecePraetorian ]
  id: ClothingModsuitHelmetPraetorian
  name: Praetorian modsuit helmet
  description: A state-of-the-art helmet designed by NanoTrasen for the Praetorian modsuit.
  categories: [ HideSpawnMenu ]
  components:
  - type: FlashImmunity
  - type: FlashSoundSuppression
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.6
        Radiation: 0.5
        Caustic: 0.6
    traumaDeductions:
      Dismemberment: 0.4
      OrganDamage: 0.4
      BoneDamage: 0.4
      VeinsDamage: 0
      NerveDamage: 0

- type: entity
  parent: [ ClothingModsuitChestplateStandard, BaseModsuitPiecePraetorian ]
  id: ClothingModsuitChestplatePraetorian
  name: Praetorian modsuit chestplate
  description: A state of the art chestplate designed by NanoTrasen for the Praetorian modsuit. It incorporates powered servos to reduce the equipment load.
  categories: [ HideSpawnMenu ]
  components:
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.5
        Radiation: 0.5
        Caustic: 0.6
    traumaDeductions:
      Dismemberment: 0.4
      OrganDamage: 0.4
      BoneDamage: 0.4
      VeinsDamage: 0
      NerveDamage: 0
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: StaminaResistance
    damageCoefficient: 0.55
  - type: ExplosionResistance
    damageCoefficient: 0.55

- type: entity
  parent: [ ClothingModsuitBootsStandard, BaseModsuitPiecePraetorian ]
  id: ClothingModsuitBootsPraetorian
  name: Praetorian modsuit boots
  description: A state-of-the-art pair of magboots for the Praetorian modsuit.
  categories: [ HideSpawnMenu ]
  components:
  - type: ItemToggle
  - type: ToggleClothing
    action: ActionToggleMagboots
  - type: ComponentToggler
    components:
    - type: NoSlip
  - type: Magboots
    enabledPrefix: null

- type: entity
  parent: [ClothingModsuitStandard, BaseSecurityContraband]
  id: ClothingModsuitBrigMed
  name: security trauma modsuit control unit
  description: A robust modular hardsuit control module unit for healing commies in space.
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Nebula/Clothing/Back/Modsuits/brigmed.rsi
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingModsuitHelmetBrigMed
      gloves: ClothingModsuitGauntletsBrigMed
      outerClothing: ClothingModsuitChestplateBrigMed
      shoes: ClothingModsuitBootsBrigMed
  - type: Construction
    graph: Modsuit
    node: security
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      back:
      - state: equipped-BACKPACK-sealed

- type: entity
  parent: ClothingModsuitBrigMed
  id: ClothingModsuitBrigMedPowerCell
  suffix: High-Capacity Battery
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
        whitelist:
          components:
            - PowerCell

- type: entity
  parent: BaseClothingModsuitHelmet
  id: ClothingModsuitHelmetBrigMed
  name: trauma modsuit helmet
  description: Cool helmet without eye lenses. Eyes aren't needed for surgery.
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HEAD
      head-vox:
      - state: equipped-HEAD-vox
      head-vulpkanin:
      - state: equipped-HEAD-vulpkanin
      head-feroxi:
      - state: equipped-HEAD-feroxi
      head-hydrakin:
      - state: equipped-HEAD-hydrakin
  - type: Sprite
    sprite: _Nebula/Clothing/Head/Modsuits/brigmed.rsi
    layers:
    - state: helmet
    - state: helmet-sealed
      visible: false
      map: [ "sealed" ]
  - type: HideLayerClothing
    slots:
    - Snout
  - type: SealableClothing
    sealUpPopup: sealable-clothing-seal-up-helmet
    sealDownPopup: sealable-clothing-seal-down-helmet
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      head:
      - state: equipped-HEAD-sealed
      head-resomi:
      - state: equipped-HEAD-sealed-resomi
      head-vox:
      - state: equipped-HEAD-sealed-vox
      head-vulpkanin:
      - state: equipped-HEAD-sealed-vulpkanin
      head-feroxi:
      - state: equipped-HEAD-sealed-feroxi
      head-hydrakin:
      - state: equipped-HEAD-sealed-hydrakin
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.65
        Heat: 0.65
        Radiation: 0.6
  - type: ComponentToggler
    components:
    - type: BreathMask
    - type: PressureProtection
      highPressureMultiplier: 0.3
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      coefficient: 0.01
    - type: IdentityBlocker
    - type: IngestionBlocker
    - type: HideLayerClothing
      slots:
      - Hair
      - Snout
      - HeadTop
      - HeadSide
  #THIS WILL BE REPLACED WITH MODULE ↓↓
  - type: PointLight
    enabled: false
    radius: 5
    energy: 3
    lightMask: ConeSingle
    autoRot: true
    netsync: true
  - type: HandheldLight
    addPrefix: true
    blinkingBehaviourId: blinking
    radiatingBehaviourId: radiating
  - type: LightBehaviour
    behaviours:
      - !type:FadeBehaviour
        id: radiating
        interpolate: Linear
        maxDuration: 2.0
        startValue: 3.0
        endValue: 2.0
        isLooped: true
        reverseWhenFinished: true
      - !type:PulseBehaviour
        id: blinking
        interpolate: Nearest
        maxDuration: 1.0
        startValue: 0.1
        endValue: 2.0
        isLooped: true
  - type: Battery
    maxCharge: 600 #lights drain 3/s but recharge of 2 makes this 1/s. Therefore 600 is 10 minutes of light.
    startingCharge: 600
  - type: BatterySelfRecharger
    autoRechargeRate: 2
  - type: ShowHealthBars
  - type: ShowHealthIcons
  - type: ShowDiseaseIcons

- type: entity
  parent: ClothingHandModsuitBase
  id: ClothingModsuitGauntletsBrigMed
  name: trauma modsuit gauntlets
  description: Cool gauntlets.
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Nebula/Clothing/Hands/Modsuits/brigmed.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      map: [ "sealed" ]
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    slots: [ gloves ]
  - type: DamageOnInteractProtection
    damageProtection:
      flatReductions:
        Heat: 10
  - type: Fiber
    fiberMaterial: fibers-modular
    fiberColor: fibers-black
  - type: FingerprintMask
  - type: SealableClothing
    sealUpPopup: sealable-clothing-seal-up-gauntlets
    sealDownPopup: sealable-clothing-seal-down-gauntlets
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      gloves:
      - state: equipped-HAND-sealed
      gloves-vox:
      - state: equipped-HAND-sealed-vox

- type: entity
  parent: ClothingOuterBase
  id: ClothingModsuitChestplateBrigMed
  name: trauma modsuit chestplate
  description: A robust modular suit cover with white ceramic inserts for extra drip.
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: AllowSuitStorage
  - type: Sprite
    sprite: _Nebula/Clothing/OuterClothing/Modsuits/brigmed.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      map: [ "sealed" ]
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    slots: [ outerClothing ]
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: SealableClothing
    sealUpPopup: sealable-clothing-seal-up-chestplate
    sealDownPopup: sealable-clothing-seal-down-chestplate
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING-sealed
      outerClothing-resomi:
      - state: equipped-OUTERCLOTHING-sealed-resomi
      outerClothing-vox:
      - state: equipped-OUTERCLOTHING-sealed-vox
  - type: ExplosionResistance
    damageCoefficient: 0.4
  - type: ModifyDelayedKnockdown
    delayDelta: 2.5
    knockdownTimeDelta: -2.5
  - type: StaminaResistance
    damageCoefficient: 0.7
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    coverage:
    - Torso
    - Arm
    - Hand
    - Leg
    - Foot
    - Tail
    - Other
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.6
        Radiation: 0.6
  - type: ComponentToggler
    components:
    - type: PressureProtection
      highPressureMultiplier: 0.3
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      coefficient: 0.01
  - type: FireProtection
    reduction: 0.5


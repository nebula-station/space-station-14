# Hand Implant

- type: entity
  parent: SurgeryOpenCavityBase
  id: SurgeryOpenHandImplant
  name: Open Cavity For Hand Implant
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
  - type: SurgeryPartCondition
    parts: [ Hand ]
  - type: SurgeryOrganSlotCondition
    organSlot: HandImplant

- type: entity
  parent: SurgeryInstallAugmentBase
  id: SurgeryInsertHandImplant
  name: Insert Hand Implant
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepInsertOrgan
    - SurgeryStepSealOrganWound
  - type: SurgeryPartCondition
    parts: [ Hand ]
  - type: SurgeryOrganCondition
    organ: HandImplant
  - type: SurgeryOrganSlotCondition
    organSlot: HandImplant

- type: entity
  parent: SurgeryRemoveAugmentBase
  id: SurgeryRemoveHandImplant
  name: Remove Hand Implant
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepClampInternalBleeders
    - SurgeryStepRemoveOrgan
  - type: SurgeryPartCondition
    parts: [ Hand ]
  - type: SurgeryOrganCondition
    organ: HandImplant


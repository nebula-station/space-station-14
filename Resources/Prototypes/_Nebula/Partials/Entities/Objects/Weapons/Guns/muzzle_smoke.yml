# Nebula - Monolith: powder smoke particles and the Hullrot powder flash for ballistic guns.

# Smoke particles blown out of the barrel on every shot
- type: entity
  id: BaseWeaponPistol
  components:
  - type: ParticleOnGunShot
    effect: MuzzleSmoke
    inheritAngle: true


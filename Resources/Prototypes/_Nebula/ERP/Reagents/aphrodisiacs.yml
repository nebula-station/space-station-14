- type: reagent
  id: Crocin
  name: reagent-name-crocin
  group: Narcotics
  desc: reagent-desc-crocin
  physicalDesc: reagent-physical-desc-syrupy
  flavor: sweet
  color: "#FFADFF"
  metabolisms:
    Bloodstream:
      effects:
      - !type:AdjustArousal
        conditions:
        - &erpConsent
          !type:ErpConsentCondition
          tag: Erp
        amount: 2
        maxFraction: 0.3 # makes you horny, can't finish you off by itself
      - !type:PopupMessage
        conditions:
        - *erpConsent
        type: Local
        visualType: Medium
        messages:
        - reagent-effect-crocin-1
        - reagent-effect-crocin-2
        - reagent-effect-crocin-3
        probability: 0.1


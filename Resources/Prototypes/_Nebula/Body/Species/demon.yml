      required: false
    enum.HumanoidVisualLayers.Overlay:
      limit: 6
      required: false
    enum.HumanoidVisualLayers.Special:
      limit: 6
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceDemon
  categories: [ HideSpawnMenu ]
  name: arcana appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganDemonTorso
      Head: OrganDemonHead
      Tail: OrganDemonTail
      Wings: OrganDemonWings
      ArmLeft: OrganDemonArmLeft
      ArmRight: OrganDemonArmRight
      HandRight: OrganDemonHandRight
      HandLeft: OrganDemonHandLeft
      LegLeft: OrganDemonLegLeft
      LegRight: OrganDemonLegRight
      FootLeft: OrganDemonFootLeft
      FootRight: OrganDemonFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Demon

- type: entity
  parent:
  - AppearanceDemon
  - BaseSpeciesMobOrganic
  id: MobDemon
  name: Urisst' Mzhand Demon
  components:
  - type: Speech
    speechSounds: Lizard
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    animation: WeaponArcPunch
    damage:
      types:
        Piercing: 5
  - type: BonusMeleeDamage
    damageModifierSet:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Asphyxiation: 0.85
  - type: RecoilAbsorber
    modifier: 0.5
  - type: WeakToHoly
  - type: Sprinter
    staminaDrainRate: 23.4
    sprintSpeedMultiplier: 1.63
  - type: TemperatureDamage
    heatDamageThreshold: 325
    coldDamageThreshold: 260
    coldDamage:
      types:
        Cold: 0.085
    heatDamage:
      types:
        Heat: 0.8
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - Karshan
    understands:
    - TauCetiBasic
    - Karshan
  - type: Butcherable
    spawned:
    - id: FoodMeatDemon
      amount: 5
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead

- type: entity
  parent: OrganBaseOrganic
  id: OrganDemon
  abstract: true
  suffix: arcana

- type: entity
  parent: OrganDemon
  id: OrganDemonExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Nebula/Mobs/Species/Demon/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Nebula/Mobs/Species/Demon/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Demon

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorsoTailed, OrganDemonExternal ]
  id: OrganDemonTorso
  components:
  - type: BodyPart
    slots:
    - Head
    - Tail
    - Wings
    - ArmLeft
    - ArmRight
    - LegLeft
    - LegRight
    - Appendix
    - Heart
    - Lungs
    - Stomach
    - Liver
    - Kidneys

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganDemonExternal ]
  id: OrganDemonHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.HeadSide
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.FacialHair

- type: entity
  parent: [ OrganBaseTail, OrganDemonExternal ]
  id: OrganDemonTail
  components:
  - type: Sprite
    state: tail
  - type: VisualOrgan
    data:
      sprite: _Trauma/empty.rsi
      state: empty
  - type: OrganComponents
    onAdd:
    - type: Wagging
      action: ActionToggleWagging

- type: entity
  parent: [ OrganBaseWings, OrganDemonExternal ]
  id: OrganDemonWings
  components:
  - type: Sprite
    sprite: _Nebula/Mobs/Customization/Demon/demonwings.rsi
    state: succubus_wings
  - type: VisualOrgan
    data:
      sprite: _Trauma/empty.rsi
      state: empty

- type: entity
  parent: [ OrganBaseArmLeft, OrganDemonExternal ]
  id: OrganDemonArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganDemonExternal ]
  id: OrganDemonArmRight

- type: entity

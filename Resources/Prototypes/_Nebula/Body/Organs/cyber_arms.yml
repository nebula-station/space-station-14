- type: entity
  parent: ActionAugmentOpenToolsPanel
  id: ActionCyberToolArmLeft
  name: Left arm tools
  description: Pick a tool built into your left arm, or retract the deployed one.

- type: entity
  parent: ActionAugmentOpenToolsPanel
  id: ActionCyberToolArmRight
  name: Right arm tools
  description: Pick a tool built into your right arm, or retract the deployed one.

- type: entity
  abstract: true
  id: BaseCyberToolArm
  components:
  - type: Augment
  - type: Storage
    maxItemSize: Huge
    defaultStorageOrientation: Vertical
    grid:
    - 0,0,11,5
    whitelist:
      components:
      - CyberToolArmItem
  - type: ItemToggle
    onUse: false
    onActivate: false
  - type: AugmentToolPanel
    switchCharge: 0
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.AugmentToolPanelUiKey.Key:
        type: AugmentToolPanelMenuBoundUserInterface
        interactionRange: 0
  - type: AugmentActivatableUI
    key: enum.AugmentToolPanelUiKey.Key

- type: entity
  abstract: true
  parent: BaseCyberToolArm
  id: BaseCyberArmMechwright
  description: Augmented arm for the tiders of the modern age.
  components:

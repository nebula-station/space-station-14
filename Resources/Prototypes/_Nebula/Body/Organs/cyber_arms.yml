    tools:
    - Wrench
    - Screwdriver
    - Crowbar
    - Wirecutter
    - Welder

- type: entity
  parent: [ OrganCyberneticArmLeft, BaseCyberArmMechwright ]
  id: OrganCyberArmMechwrightLeft
  name: left mechwright arm
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Cyberlimbs/parts.rsi

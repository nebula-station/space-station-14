- type: startingGear
  id: BlueShieldOfficerGearDebug
  parent: BlueshieldOfficerGear
  equipment:
    outerClothing: ClothingBlueshieldArmourVest
    head: ClothingHeadHatBeretBlueshield
    gloves: ClothingHandsGlovesCombat
    shoes: ClothingShoesBootsJack
    jumpsuit: ClothingUniformJumpsuitBlueshieldShirt

- type: startingGear
  id: BlueShieldOfficerGearSuit
  parent: BlueShieldOfficerGearDebug
  equipment:
    outerClothing: ClothingOuterHardsuitBlueshieldLight
    head: ClothingHeadHelmetHardsuitBlueshield

- type: entity
  parent: MobHuman
  id: MobHumanBSOBase
  name: Blueshield Officer Base
  suffix: DEBUG
  components:
  - type: Loadout
    prototypes: [ BlueShieldOfficerGearDebug ]
    roleLoadout: [ RoleSurvivalSecurity ]
  - type: RandomMetadata
    nameSegments:
    - NamesFirst
    - NamesLast
    nameFormat: name-format-standard
  - type: AutoImplant
    implants:
    - MindShieldImplant
  # Nebula start
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  # Nebula end

- type: entity
  parent: MobHumanBSOBase
  id: MobHumanBSOSuit
  name: Blueshield Officer
  components:
  - type: Loadout
    prototypes: [ BlueShieldOfficerGearSuit ]
    roleLoadout: [ RoleSurvivalSecurity ]
  # Nebula start
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  # Nebula end

- type: entity
  name: Blueshield Officer Base Spawner
  id: SpawnMobHumanBSOBase
  parent: MarkerBase
  suffix: DEBUG
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: Mobs/Species/Human/parts.rsi
      state: full
  - type: ConditionalSpawner
    prototypes:
    - MobHumanBSOBase

- type: entity
  name: Blueshield Officer Suit Spawner
  id: SpawnMobHumanBSOSuit
  parent: SpawnMobHumanBSOBase
  components:
  - type: ConditionalSpawner
    prototypes:
    - MobHumanBSOSuit

- type: entity
  parent: MobHuman
  id: MobHumanGreyTide
  name: The Greytide
  components:
  - type: Loadout
    prototypes: [ GreyTideAntagGear ]

- type: entity
  parent: MobHuman
  id: MobHumanTunnelClown
  name: Tunnel clown
  components:
  - type: RandomHumanoidAppearance
    randomizeName: true
  - type: Loadout
    prototypes: [ TunnelClownAntagGear ]
  - type: PermanentStatusEffects
    statusEffects:
    - StatusEffectClumsyClown
  - type: SleepEmitSound
    snore: /Audio/Voice/Misc/silly_snore.ogg
    interval: 10
  - type: SpeechFontOverride
    font: LDFComicSans
  - type: Clown
  # Nebula start
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  # Nebula end


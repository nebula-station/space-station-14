- type: entity
  parent: MobHuman
  id: MobHumanWizardDebug
  name: Wizard
  suffix: DEBUG
  components:
  - type: Loadout
    prototypes: [ WizardGear ]
    roleLoadout: [ RoleSurvivalExtended ]
  - type: RandomMetadata
    nameSegments:
    - WizardFirst
    - WizardLast
    nameFormat: name-format-standard
  # Nebula start
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  # Nebula end


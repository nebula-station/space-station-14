- type: entity
  abstract: true
  parent: [ BaseItem, BaseSlicingRefinable ]
  id: BaseFish
  name: fish
  description: Water-born creature from the infinite sea... Or toilet.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Fishing/fish.rsi
  - type: Item
    sprite: _Goobstation/Objects/Specific/Fishing/fish.rsi
  - type: Fish
    difficulty: 0.029
  - type: StaticPrice
    price: 250
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatFish
      amount: 2
  - type: Tag
    tags:
    - Fish
  # Nebula start
  - type: MeleeWeapon
    angle: 0
    damage:
      types:
        Blunt: 1.67
        Slash: 1.67
        Piercing: 1.67
  - type: MobThresholds
    thresholds:
      0: Alive
      1: Critical
      5: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.7
      80: 0.5
  # Nebula end


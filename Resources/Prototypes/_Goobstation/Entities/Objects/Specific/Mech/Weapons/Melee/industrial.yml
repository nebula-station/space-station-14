- type: entity
  id: WeaponMechMeleeDrill
  parent: [ BaseMechWeaponMelee, BaseSalvageContraband ] # Trauma - Contraband tag
  name: exosuit drill
  suffix: Mech Weapon, Melee, Industrial
  description: Equipment for mining exosuits. This is the drill that'll pierce the rocks!
  components:
  - type: Sprite
    state: mecha_drill
  - type: Tag
    tags:
    - Pickaxe
    - IndustrialMech
  - type: MeleeWeapon
    canWideSwing: false
    autoAttack: true
    angle: 0
    wideAnimationRotation: -90
    soundHit:
      path: "/Audio/Items/drill_hit.ogg"
    attackRate: 3.5
    # Nebula start
    damage:
      types:
        Structural: 15
        Blunt: 1
        Slash: 1
        Piercing: 1
    # Nebula end


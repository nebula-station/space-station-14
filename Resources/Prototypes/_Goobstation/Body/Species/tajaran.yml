- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceTajaran
  categories: [ HideSpawnMenu ]
  name: tajaran appearance
  components:
  - type: Inventory
    speciesId: tajaran
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: jumpsuit-female
      shoes:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: shoes
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: jumpsuit
      shoes:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: shoes
  - type: InitialBody
    organs:
      Torso: OrganTajaranTorso
      Head: OrganTajaranHead
      Tail: OrganTajaranTail
      ArmLeft: OrganTajaranArmLeft
      ArmRight: OrganTajaranArmRight
      HandRight: OrganTajaranHandRight
      HandLeft: OrganTajaranHandLeft
      LegLeft: OrganTajaranLegLeft
      LegRight: OrganTajaranLegRight
      FootLeft: OrganTajaranFootLeft
      FootRight: OrganTajaranFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Tajaran

- type: entity
  parent:
  - AppearanceTajaran
  - BaseSpeciesMobOrganic
  id: MobTajaran
  name: Urist McTajaran
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 140
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 5
  - type: TemperatureProtection
    coefficient: 0.1
  - type: Flammable
    firestackFade: -0.08
  - type: TemperatureDamage
    coldDamageThreshold: 248.15
    coldDamage:
      types:
        Cold: 0.080
    heatDamage:
      types:
        Heat: 1.80
  - type: ThermalRegulator
    normalBodyTemperature: 311.76
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: petting-success-soft-floofy
    interactSuccessSound: /Audio/Effects/thudswoosh.ogg
    messagePerceivedByOthers: hugging-success-generic-others
  - type: Speech
    speechVerb: Felinid
    speechSounds: Alto
    allowedEmotes: [ 'Meow', 'Mew', 'Growl', 'Purr', 'Hiss' ]
  - type: TypingIndicator
    proto: felinid
  - type: Vocal
    emoteSounds: MaleFelinid
    wilhelm: /Audio/Nyanotrasen/Voice/Felinid/cat_wilhelm.ogg
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - SiikMaas
    understands:
    - TauCetiBasic
    - SiikMaas
  - type: Reactive
    reactions:
    - reagents: [ Water, SpaceCleaner ]
      methods: [ Touch ]
      effects:
      - !type:WashCreamPie
    - reagents: [ Water ]
      methods: [ Touch ]
      effects:
      - !type:Emote
        emote: Scream
        probability: 0.2
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 4
        Piercing: 1
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 1
  - type: Stamina
    baseCritThreshold: 85
    animationThreshold: 40
  - type: NightVision
    enabled: false
    action: ActionToggleNightVision
    prioritized: false
    relayOverlay: false
    lightingColor: '#FFFFFF15'
  - type: PseudoItem
    storedOffset: 0,17
    shape:
    - 0,0,1,4
    - 0,2,3,4
    - 4,0,5,4
  - type: NoShoesSilentFootsteps


- type: entity
  id: BlueShieldDeputy
  parent: MobHuman
  name: Blueshield deputy
  suffix: Human
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: Loadout
    prototypes: [BlueshieldDeputyGear]
  - type: RandomMetadata
    nameSegments:
    - BsdNames
    - BsdPrefix
  - type: ReplacementAccent
    accent: cowboy
  - type: MindShield
  - type: AntagImmune
  # Nebula start
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  # Nebula end

- type: startingGear
  id: BlueshieldDeputyGear
  equipment:
    eyes: ClothingEyesGlassesBSO
    jumpsuit: ClothingUniformJumpsuitBlueshieldOfficer
    head: ClothingHeadHatCowboyBlueshield
    outerClothing: ClothingBlueshieldArmoredCowboyJacket
    gloves: ClothingHandsGlovesCombat
    shoes: ClothingShoesBootsJack
    id: BlueshieldPDA
    ears: ClothingHeadsetAltCommand
    pocket1: DrinkEnergyDrinkCan
    pocket2: TelescopicBaton
    belt: ClothingBeltHolsterFilledBlueshield
    back: ClothingBackpackBlueshield
  storage:
    back:
    - ClothingMaskGasSecurity
    - Flash
    - BluespaceLifelineImplanter
    - DefibrillatorCompact
    - SecHypo
  inhand:
  - MedkitCombatFilled

- type: ghostRole
  id: BlueShieldDeputyGhostRole
  name: ghost-role-information-bsd-name
  description: ghost-role-information-bsd-description
  rules: ghost-role-information-bsd-rules
  entityPrototype: BlueShieldDeputy

- type: entity
  id: BlueShieldDeputySpawnBriefcase
  name: Blueshield Deputy Teleporter briefcase
  description: A special device, that opens a bluespace portal that is linked to the nearest NanoTrasen Deputy office, when your local blueshield deputy is ready, he will be teleported to this location.
  parent: BaseItem
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Tools/executive_briefcase.rsi
    state: icon_alt
  - type: Item
    size: Ginormous
  - type: GhostRole
    name: ghost-role-information-bsd-name
    description: ghost-role-information-bsd-description
    rules: ghost-role-information-bsd-rules
    raffle:
      settings: default
    job: BlueshieldOfficer
  - type: GhostRoleMobSpawner
    prototype: BlueShieldDeputy

- type: entity
  id: SpawnPodBsd
  categories: [ HideSpawnMenu ]
  name: SpawnSupplyBsd
  parent: SpawnSupplyEmpty
  components:
  - type: SpawnOnDespawn
    prototype: BlueShieldDeputySpawnBriefcase

- type: listing
  id: NTRExecutiveBSDCall
  name: ntr-executive-bsd-name
  description: ntr-executive-bsd-desc
  productEntity: SpawnPodBsd
  icon:
    sprite: _Goobstation/Objects/Tools/executive_briefcase.rsi
    state: icon_alt
  cost:
    NTLoyaltyPoint: 40
  categories:
  - NTRpersonal
  restockTime: 30m
  conditions:
  - !type:ListingLimitedStockCondition
    stock: 1

- type: localizedDataset
  id: BsdNames
  values:
    prefix: bsd-names-dataset-
    count: 17

- type: localizedDataset
  id: BsdPrefix
  values:
    prefix: bsd-prefix-dataset-
    count: 16

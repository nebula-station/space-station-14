# tables

- type: entityTable
  id: CalmPestEventsTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - id: SnailMigrationLowPop
    - id: CockroachMigration
    - id: MouseMigration
    - id: RandomCritterHorde

- type: entityTable
  id: SpicyPestEventsTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - id: KingRatMigration
    - id: SnailMigration

# events

- type: entity
  id: MouseMigration
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    earliestStart: 15
    weight: 3 # Nebula edit
    duration: 50
  - type: VentCrittersRule
    entries:
    - id: SpawnMobMouse # Trauma - replaces individual mice
      prob: 0.025 # Nebula edit
    - id: MobMouseCancer
      prob: 0.01 # Nebula edit
# Events always spawn a critter regardless of Probability https://github.com/space-wizards/space-station-14/issues/28480 I added the Rat King to their own event with a player cap.

- type: entity
  id: KingRatMigration
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    earliestStart: 15
    weight: 3 # Nebula edit
    duration: 50
    occursDuringRoundEnd: false
    minimumPlayers: 30 # Hopefully this is enough for the Rat King's potential Army (it was not, raised from 15 -> 30)
  - type: VentCrittersRule # We don't use Horde here to make RK spawns less predictable.
    entries:
    # <Trauma>
    - id: MobLootbug
      prob: 0.004 # Nebula edit
    # </Trauma>
    - id: MobMouse
      prob: 0.01 # Nebula edit
    - id: MobMouse1
      prob: 0.01 # Nebula edit
    - id: MobMouse2
      prob: 0.01 # Nebula edit
    - id: MobMouseCancer
      prob: 0.0005 # Nebula edit
    specialEntries:
    - id: SpawnPointGhostRatKing
      prob: 0.001

- type: entity
  id: CockroachMigration
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    weight: 3 # Nebula edit
    duration: 50
  - type: VentCrittersRule
    entries:
    - id: MobCockroach
      prob: 0.015 # Nebula edit
    - id: MobMothmaggot # Trauma - was MobMothroach
      prob: 0.004 # Nebula edit
    - id: MobLootbug # Goobstation
      prob: 0.003 # Nebula edit
    - id: MobMoproach
      prob: 0.002 # Nebula edit

- type: entity
  id: SnailMigrationLowPop
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    weight: 3 # Nebula edit
    duration: 50
  - type: VentCrittersRule
    entries:
    - id: MobSnail
      prob: 0.01 # Nebula edit
    - id: MobSnailSpeed
      prob: 0.001 # Nebula edit
    - id: MobSnailMoth
      prob: 0.001 # Nebula edit

- type: entity
  id: SnailMigration
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    earliestStart: 15
    weight: 3 # Nebula edit
    duration: 50
    minimumPlayers: 30
  - type: VentCrittersRule
    entries:
    - id: MobSnail
      prob: 0.01 # Nebula edit
    - id: MobSnailSpeed
      prob: 0.001 # Nebula edit
    - id: MobSnailMoth
      prob: 0.001 # Nebula edit
    - id: MobSnailInstantDeath
      prob: 0.00002 # Nebula edit; Trauma - 4x

- type: entity
  parent: BaseStationEventShortDelay
  id: RandomCritterHorde # My deepest apologies, Mr. Secoff. You just wasted your time :)
  components:
  - type: StationEvent
    startAnnouncement: station-event-vent-creatures-start-horde-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    earliestStart: 15
    weight: 3 # Nebula edit; Slightly more common than other hordes
    duration: 5
    maxDuration: 20
    reoccurrenceDelay: 15 # Shorter because this event is basically a nat zero on the round. It only exists to potentially confuse security or the crew
  - type: VentHordeRule
    table: !type:GroupSelector
      rolls: 2,3 # Nebula edit
      children:
      - !type:GroupSelector
        children: # Increased chances for special snails on purpose. Makes it a bit more interesting.
        - id: MobSnail
        - id: MobSnailSpeed
        - id: MobSnailMoth
      - !type:GroupSelector
        children: # Increased chances for special roaches on purpose. Makes it a bit more interesting.
        - id: MobCockroach
        - id: MobMothroach
        - id: MobMoproach
          weight: 0.5
      - !type:GroupSelector
        children:
        - id: MobMouse
        - id: MobMouse1
        - id: MobMouse2

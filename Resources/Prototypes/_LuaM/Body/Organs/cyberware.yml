# Subdermal armor slot of the chest. Only one fits.

- type: entity
  abstract: true
  parent: BaseAugment
  id: BaseOrganSubdermalArmor
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/cybernetics.rsi
    state: armor-chest
  - type: ChildOrgan
    parents: [ Torso ]
  - type: Organ
    category: Subdermal
  - type: Cybernetics
  - type: Item
    size: Small

- type: entity
  parent: BaseOrganSubdermalArmor
  id: OrganDermalArmor
  name: dermal armor
  description: A flexible but durable polymer carapace that goes under the skin. Flat damage reduction against blunt, slash and piercing, but more damage from shock.
  components:
  - type: OrganComponents
    onAdd:
    - type: SubdermalArmor
      modifiers:
        coefficients:
          Shock: 1.25
        flatReductions:
          Blunt: 3.5
          Slash: 3.5
          Piercing: 3.5
  - type: CyberwareHumanity
    cost: 1
  - type: StaticPrice
    price: 1500

- type: entity
  parent: BaseOrganSubdermalArmor
  id: OrganDermalArmorPDV
  name: PD-VI E-SAPI armor plates
  description: An array of E-SAPI armor plates that go under the skin. More vulnerable to shock and a bit heavy to move in, but more resistant to bullets and heat.
  components:
  - type: Sprite
    color: "#c41e24"
  - type: OrganComponents
    onAdd:
    - type: SubdermalArmor
      modifiers:
        coefficients:
          Shock: 1.25
          Heat: 0.85
          Piercing: 0.85
          Blunt: 0.9
          Slash: 0.9
    - type: CyberwareSpeedModifier
      walkModifier: 0.95
      sprintModifier: 0.95
  - type: CyberwareHumanity
    cost: 2
  - type: StaticPrice
    price: 1500

- type: entity
  parent: BaseOrganSubdermalArmor
  id: OrganDermalArmorReflective
  name: reflective dermal armor
  description: A mirror-polished carapace under the skin that can bounce shots back. A bit heavy to move in, gives no damage reduction and conducts shock.
  components:
  - type: Sprite
    sprite: _LuaM/Objects/Misc/reflective_armor.rsi
    state: icon
  - type: OrganComponents
    onAdd:
    - type: Reflect
      reflectProb: 0.2
    - type: CyberwareSpeedModifier
      walkModifier: 0.9
      sprintModifier: 0.9
    - type: SubdermalArmor
      modifiers:
        coefficients:
          Shock: 1.25
  - type: CyberwareHumanity
    cost: 3
  - type: StaticPrice
    price: 1500

- type: entity
  parent: BaseOrganSubdermalArmor
  id: OrganDermalArmorHeavyUSSP
  name: ultra-durable armor plate base
  description: A heavy USSP armor plate base under the skin. Every 20 seconds it fully stops one bullet, but it slows you down.
  components:
  - type: Sprite
    sprite: _LuaM/Objects/Misc/heavy_armor_base.rsi
    state: icon
  - type: OrganComponents
    onAdd:
    - type: BulletAbsorb
      cooldown: 20
    - type: CyberwareSpeedModifier
      walkModifier: 0.9
      sprintModifier: 0.9
  - type: CyberwareHumanity
    cost: 3
  - type: StaticPrice
    price: 1500

- type: entity
  parent: BaseOrganSubdermalArmor
  id: OrganOpticalCamo
  name: optical camo implant
  description: A mesh of light-bending fibers under the skin. Makes you fully invisible for a few seconds, attacking or getting hurt breaks it.
  components:
  - type: Sprite
    sprite: _LuaM/Objects/Misc/optical_camo.rsi
    state: icon
  - type: OrganComponents
    onAdd:
    - type: OpticalCamo
      activateSound:
        path: /Audio/Effects/stealthoff.ogg
        params:
          pitch: 1.4
      deactivateSound:
        path: /Audio/Effects/stealthoff.ogg
  - type: CyberwareHumanity
    cost: 2
  - type: StaticPrice
    price: 2000


# Implants wired into the central nervous system. Only one fits.

- type: entity
  abstract: true
  parent: BaseAugment
  id: BaseOrganCNSImplant
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/cybernetics.rsi
  - type: ChildOrgan
    parents: [ Torso ]
  - type: Organ
    category: Cns
  - type: Cybernetics
  - type: CyberwareHumanity
    cost: 3
  - type: Item
    size: Small
  - type: StaticPrice
    price: 1500

- type: entity
  parent: BaseOrganCNSImplant
  id: OrganCNSTSFSandevistan
  name: TSF WJY-21X "Leuko" implant suite
  description: An experimental piece of cyberware developed under contract by Erebus HI that is wired into the central nervous system. Equipped with an experimental reverse-engineered slower-recharging design of a MMC sandevistan.
  components:
  - type: Sprite
    state: leuko
  - type: OrganComponents
    onAdd:
    - type: CnsSandevistanUser
      movementSpeedModifier: 1.5
      safeDuration: 15
      rechargeDuration: 50

- type: entity
  parent: BaseOrganCNSImplant
  id: OrganCNSMMCSandevistan
  name: MMC EVT-002 "Lotus" neural implant
  description: It's a sterile bag full of a series of autoinjectors, electroneural links, and thermomachines wired into the central nervous system, designed to allow the user to push themselves to the limit.
  components:
  - type: Sprite
    state: adaptive_binoculars
  - type: OrganComponents
    onAdd:
    - type: CnsSandevistanUser
      movementSpeedModifier: 1.5
      safeDuration: 10
      rechargeDuration: 40

- type: entity
  parent: BaseOrganCNSImplant
  id: OrganCNSKerenzikov
  name: USSP "Kerenzikov" reflex booster
  description: A crude USSP reflex booster wired into the central nervous system. Unlike the Sandevistan it lets you shoot while it runs, but it tears your body the whole time, and three times harder after 10 seconds.
  components:
  - type: Sprite
    state: booster
  - type: OrganComponents
    onAdd:
    - type: CnsSandevistanUser
      actionProto: ActionToggleKerenzikov
      movementSpeedModifier: 1.35
      attackSpeedModifier: 1.5
      safeDuration: 0
      rechargeDuration: 30
      blockGuns: false
      overloadWarnings: false
      overloadGlitchIntensity: 0.4
      overloadInterval: 1
      overloadDamage:
        types:
          Piercing: 0.5
          Blunt: 0.5
          Slash: 0.5
      heavyOverloadAfter: 10
      heavyOverloadWarning: kerenzikov-cns-burn-soon
      heavyOverloadDamage:
        types:
          Piercing: 1.5
          Blunt: 1.5
          Slash: 1.5


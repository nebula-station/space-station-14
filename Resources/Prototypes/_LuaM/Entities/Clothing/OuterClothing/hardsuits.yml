# Ported from Monolith-DS (LuaM) by Nebula.
# Nebula: there is no Warlord (WL-01) suit here, so the WL-02 stands on its own on the hardsuit base.
# Not added to any spawns, loadouts or stores yet, only the spawn menu.

- type: entity
  parent: [ ClothingOuterHardsuitBase, BaseMajorContraband ]
  id: ClothingOuterHardsuitLuaMAyaks
  name: WL-02 "Ajax" hardsuit
  description: An experimental, ultra-tech revision of the Warlord suit made for those who go first into a breach. Reinforced plating and an advanced heat sink system keep the wearer on their feet and firing for as long as possible.
  components:
  - type: Sprite
    sprite: _LuaM/Clothing/OuterClothing/Hardsuits/merc_warlord_mk2.rsi
  - type: Clothing
    sprite: _LuaM/Clothing/OuterClothing/Hardsuits/merc_warlord_mk2.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.5
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.4
  - type: Armor
    coverage:
    - Torso
    - Arm
    - Hand
    - Leg
    - Foot
    - Tail
    - Other
    traumaDeductions:
      Dismemberment: 0.4
      OrganDamage: 0.4
      BoneDamage: 0.4
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.4
        Slash: 0.5
        Piercing: 0.55
        Heat: 0.55
        Radiation: 0.5
        Caustic: 0.7
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitLuaMAyaks
  - type: StaminaResistance
    damageCoefficient: 0.5

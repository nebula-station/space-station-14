# Ported from Monolith-DS (LuaM) by Nebula.

- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: ClothingHeadHelmetHardsuitLuaMAyaks
  name: WL-02 "Ajax" helmet
  description: The helmet of the experimental Warlord suit. Flash immunity and mass scanner support are kept, the plating is thicker.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _LuaM/Clothing/Head/Hardsuits/merc_warlord_mk2.rsi
  - type: Clothing
    sprite: _LuaM/Clothing/Head/Hardsuits/merc_warlord_mk2.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    coverage:
    - Head
    traumaDeductions:
      Dismemberment: 0.4
      OrganDamage: 0.4
      BoneDamage: 0.4
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Heat: 0.8
  - type: FlashImmunity
  - type: PointLight
    radius: 8
    energy: 3
    color: "#e24242"
  # Mass scanner
  - type: RadarConsole
    followEntity: true
  - type: ActivatableUI
    key: enum.RadarConsoleUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface

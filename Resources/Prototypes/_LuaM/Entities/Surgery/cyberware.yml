# Subdermal armor

- type: entity
  parent: SurgeryOpenCavityBase
  id: SurgeryOpenSubdermal
  name: Open Cavity For Subdermal Armor
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
  - type: SurgeryPartCondition
    parts: [ Torso ]
  - type: SurgeryOrganSlotCondition
    organSlot: Subdermal

- type: entity
  parent: SurgeryInstallAugmentBase
  id: SurgeryInsertSubdermal
  name: Insert Subdermal Armor
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepInsertOrgan
    - SurgeryStepSealOrganWound
  - type: SurgeryPartCondition
    parts: [ Torso ]
  - type: SurgeryOrganCondition
    organ: Subdermal
  - type: SurgeryOrganSlotCondition
    organSlot: Subdermal

- type: entity
  parent: SurgeryRemoveAugmentBase
  id: SurgeryRemoveSubdermal
  name: Remove Subdermal Armor
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepClampInternalBleeders
    - SurgeryStepRemoveOrgan
  - type: SurgeryPartCondition
    parts: [ Torso ]
  - type: SurgeryOrganCondition
    organ: Subdermal

# CNS implant


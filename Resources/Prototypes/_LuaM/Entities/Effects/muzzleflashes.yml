# Ported from Monolith-DS (LuaM) by Nebula.
# Muzzle flashes with powder smoke from Hullrot. Nebula: Monolith replaced the base MuzzleFlashEffect, here the
# powder flash is its own prototype set on the cartridges, so laser and other non-powder guns keep their flash.
# The offset is per layer, a sprite offset would also move the flashes of the effects inheriting from this one.

- type: entity
  parent: MuzzleFlashEffect
  id: MuzzleFlashEffectLuaMMedium
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.2 # the flash and smoke animations are 0.18 s long
  - type: Sprite
    drawdepth: BelowMobs
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: _Crescent/Objects/Effects/Muzzleflash/medium.rsi
      state: flash
      offset: 0.15, 0
    - sprite: _Crescent/Objects/Effects/Muzzleflash/medium.rsi
      state: smoke
      offset: 0.15, 0


- type: entity
  name: Adjutant's rubber stamp
  parent: RubberStampBase
  id: RubberStampAdj
  suffix: DO NOT MAP
  components:
  - type: Stamp
    stampedName: stamp-component-stamped-name-adj
    stampedColor: "#3681bb"
    stampState: "paper_stamp-cap"
  - type: Sprite
    sprite: _Arcane/Objects/Misc/stamps.rsi
    state: stamp-adjutant
  - type: Item
    inhandVisuals:

        sprite: Objects/Misc/stamps.rsi
        color: "#3681bb"
      right:
      - state: stamp-inhand-right
        sprite: Objects/Misc/stamps.rsi
      - state: handle-inhand-right
        sprite: Objects/Misc/stamps.rsi
        color: "#3681bb"


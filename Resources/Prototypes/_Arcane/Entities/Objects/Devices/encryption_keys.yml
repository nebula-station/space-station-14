- type: entity
  parent: EncryptionKey
  id: EncryptionKeyIAA
  name: iaa encryption key
  description: An encryption key used by the most meticulous person.
  components:
  - type: EncryptionKey
    channels:
    - Common
    - Command
    - Security
    - Legal
    defaultChannel: Legal
  - type: Sprite
    layers:
    - state: crypt_silver
    - state: nano_label

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyLegal
  name: legal department encryption key
  description: An encryption key used by the most meticulous person.
  components:
  - type: EncryptionKey
    channels:
    - Legal
    defaultChannel: Legal
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: nano_label

- type: entity
  parent: [EncryptionKey, BaseMinorContraband]
  id: EncryptionKeyInteQ
  name: InteQ encryption key
  description: An encryption key used by InteQ.
  components:
    - type: EncryptionKey
      channels:
      - InteQ
      defaultChannel: InteQ
    - type: Sprite
      sprite: _Arcane/Objects/Devices/encryption_keys.rsi
      layers:
      - state: crypt_brown
      - state: inteq_label

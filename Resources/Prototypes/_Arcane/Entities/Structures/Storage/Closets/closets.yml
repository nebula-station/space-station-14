- type: entity
  parent: LockerBase
  id: LockerInteQVanguard
  name: InteQ vanguard locker
  components:
  - type: Sprite
    netsync: false
    sprite: _Arcane/Structures/Storage/inteq.rsi
    noRot: true
    offset: 0, 0 # 32x32 sprite, ClosetBase's offset is for the tall 32x48 lockers
    layers:
    - state: inteq
      map: ["enum.StorageVisualLayers.Base"]
    - state: vanguard_door
      map: ["enum.StorageVisualLayers.Door"]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
  - type: EntityStorageVisuals
    stateBaseClosed: inteq
    stateDoorOpen: open
    stateDoorClosed: vanguard_door
  - type: AccessReader
    access: [["InteQVanguardLeader"], ["InteQVanguard"]]

- type: entity
  parent: LockerBase
  id: LockerInteQVanguardLeader
  name: InteQ vanguard leader locker
  components:
  - type: Sprite
    netsync: false
    sprite: _Arcane/Structures/Storage/inteq.rsi
    noRot: true
    offset: 0, 0 # 32x32 sprite, ClosetBase's offset is for the tall 32x48 lockers
    layers:
    - state: inteq
      map: ["enum.StorageVisualLayers.Base"]
    - state: vanguard_leader_door
      map: ["enum.StorageVisualLayers.Door"]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
  - type: EntityStorageVisuals
    stateBaseClosed: inteq
    stateDoorOpen: open
    stateDoorClosed: vanguard_leader_door
  - type: AccessReader
    access: [["InteQVanguardLeader"]]

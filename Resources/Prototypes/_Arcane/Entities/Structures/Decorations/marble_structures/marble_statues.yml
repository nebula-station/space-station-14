- type: entity
  parent: ADTmarblelady
  id: ADTEyeMarble
  name: marble eye
  description: marble eye
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _ADT/Structures/Decoration/marble_structures/marble_eye.rsi
    state: marble_eye
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              path: /Audio/Effects/break_stone.ogg
              params:
                volume: -2


- type: reagent
  id: EngFuel
  name: reagent-name-engfuel
  parent: BaseAlcohol
  desc: reagent-desc-engfuel
  physicalDesc: reagent-physical-desc-electric
  flavor: jobfueleng
  color: "#00d9ff"
  metamorphicSprite:
    sprite: _Adventure/Objects/Consumable/Drinks/engfuelglass.rsi
    state: icon_empty
  metamorphicMaxFillLevels: 4
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: false
  metabolisms:
    Digestion:
      metabolites:
        Ethanol: 0.25
      effects:
      - !type:Satiate
        satiationType: Thirst
        factor: 1

- type: reagent
  id: MedFuel
  name: reagent-name-medfuel
  parent: BaseAlcohol
  desc: reagent-desc-medfuel
  physicalDesc: reagent-physical-desc-opaque
  flavor: jobfuelmed
  color: "#4690ff"
  metamorphicSprite:
    sprite: _Adventure/Objects/Consumable/Drinks/medfuelglass.rsi
    state: icon_empty
  metamorphicMaxFillLevels: 4
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: false
  metabolisms:
    Digestion:
      metabolites:
        Ethanol: 0.1
      effects:
      - !type:Satiate
        satiationType: Thirst
        factor: 1
      - !type:EvenHealthChange
        damage:
          Burn: -1
          Brute: -1
          Airloss: -1
          Toxin: -1
    Bloodstream:
      effects:
      - !type:GenericStatusEffect
        key: Jitter
        time: 1
        type: Remove
      - !type:ModifyStatusEffect
        effectProto: StatusEffectDrowsiness
        time: 1


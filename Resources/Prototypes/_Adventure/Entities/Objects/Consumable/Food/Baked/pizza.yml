- type: entity
  name: chocolate pizza
  parent: [FoodPizzaBase, BaseSlicingRefinableFood]
  id: FoodPizzaChocolate
  description: For those who can't choose between chocolate and pizza.
  components:
  - type: FlavorProfile
    flavors:
    - bread
    - sweet
    - chocolate
  - type: Sprite
    sprite: _Adventure/Objects/Food/pizza.rsi
    layers:
    - state: chocolate
  - type: ToolRefinable
    refineResult:
    - id: FoodPizzaChocolateSlice
      amount: 8
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 120
      - ReagentId: Vitamin
        Quantity: 12
      - ReagentId: Theobromine
        Quantity: 20
      - ReagentId: CocoaPowder
        Quantity: 10

- type: entity
  name: slice of chocolate pizza
  parent: FoodPizzaSliceBase
  id: FoodPizzaChocolateSlice
  description: A sweet tooth's dream. Won't it get too sticky?
  components:
  - type: FlavorProfile
    flavors:
    - bread
    - sweet
    - chocolate
  - type: Sprite
    sprite: _Adventure/Objects/Food/pizza.rsi
    layers:
    - state: chocolate-slice
  - type: Item
    heldPrefix: chocolate-slice
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: Vitamin
        Quantity: 1
      - ReagentId: Theobromine
        Quantity: 2
      - ReagentId: CocoaPowder
        Quantity: 0.8


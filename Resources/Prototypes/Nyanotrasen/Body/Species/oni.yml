- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceOni
  categories: [ HideSpawnMenu ]
  name: oni appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganOniTorso
      Head: OrganOniHead
      ArmLeft: OrganOniArmLeft
      ArmRight: OrganOniArmRight
      HandRight: OrganOniHandRight
      HandLeft: OrganOniHandLeft
      LegLeft: OrganOniLegLeft
      LegRight: OrganOniLegRight
      FootLeft: OrganOniFootLeft
      FootRight: OrganOniFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Oni

- type: entity
  parent:
  - AppearanceOni
  - BaseSpeciesMobOrganic
  id: MobOni
  name: Urist McOni
  components:
  - type: Speech
    speechSounds: Baritone
    speechVerb: Oni
  - type: TypingIndicator
    proto: oni
  - type: Damageable
  - type: MobThresholds
    # Nebula start
    thresholds:
      0: Alive
      165: Critical
      170: Dead
    # Nebula end
  - type: BonusMeleeDamage
    damageModifierSet:
      coefficients:
        Blunt: 1.25
        Slash: 1.25
        Piercing: 1.25
        Asphyxiation: 1.25
        Structural: 1.25
  - type: BonusStaminaDamage
    multiplier: 1.25
  - type: PlayerToolModifier
    pryTimeMultiplier: 0.6
  - type: LightweightDrunk
    boozeStrengthMultiplier: 0.5
  - type: GunRestriction
    whitelist:
      components:
      - Wieldable
    messages:
    - oni-cannot-shoot-guns-1
    - oni-cannot-shoot-guns-2
    - oni-cannot-shoot-guns-3
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - Gruntish
    understands:
    - TauCetiBasic
    - Gruntish
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5

- type: entity
  parent: OrganBaseOrganic
  id: OrganOni
  abstract: true
  suffix: oni

- type: entity
  parent: OrganOni
  id: OrganOniExternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Oni

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganOniExternal ]
  id: OrganOniTorso

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganOniExternal ]
  id: OrganOniHead
  components:

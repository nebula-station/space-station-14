- type: entity
  parent: BaseStructure
  id: StatueBaseDecoration
  abstract: true
  name: statue
  description: Piece of art.
  components:
  - type: Sprite
    noRot: true
    sprite: _Orion/Structures/Decoration/statue.rsi
    state: base
    drawdepth: Mobs
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
  - type: StaticPrice
    price: 200

- type: entity
  parent: StatueBaseDecoration
  id: StatueMarxBustDecoration
  name: marx bust
  description: Bust dedicated to the Marx.
  components:
  - type: Sprite
    state: marx

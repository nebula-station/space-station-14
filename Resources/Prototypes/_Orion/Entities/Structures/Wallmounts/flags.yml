- type: entity
  parent: BaseFlag
  id: FlagWideUnitedEarthGovernment
  name: United Earth Government wide flag
  description: Glory to United Earth Government! All hail to United Earth Government! For the humanity!
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Orion/Structures/Wallmounts/flags_64x32.rsi
    state: ueg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          FlagWideUnitedEarthGovernmentBroken:
            min: 1
            max: 1
        offset: 0

- type: entity
  parent: FlagWideUnitedEarthGovernment
  id: FlagWideUnitedEarthGovernmentBroken
  name: broken United Earth Government wide flag
  description: You can't make out anything from the banner's original print. It's ruined.
  components:
  - type: Sprite
    sprite: _Orion/Structures/Wallmounts/flags_64x32.rsi
    state: ueg_broken
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg
      - !type:DoActsBehavior
        acts: [ "Destruction" ]


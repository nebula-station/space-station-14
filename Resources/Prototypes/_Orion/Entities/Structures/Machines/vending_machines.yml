- type: entity
  parent: VendingMachine
  id: CaptainDrobe
  name: CaptainDrobe
  description: Stylish uniform, for a strong leader!
  components:
  - type: VendingMachine
    pack: CaptainDrobeInventory
  - type: VendingMachineVisuals
    offState: off
    brokenState: broken
    normalState: normal-unshaded
  - type: Sprite
    sprite: _Orion/Structures/Machines/VendingMachines/captaindrobe.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    color: "#05DAF2"
#  - type: AccessReader
#    access: [["Captain"]]

- type: entity
  parent: BaseVendingMachine # Nebula edit
  id: VendingMachineBitrunning
  name: Bitrunning Supplies Order
  description: A supplies order vending that exchanges bitrunning points for bitrunning goods.
  components:
  # - type: VendingMachine # Nebula edit
  #   pack: EmptyVendingMachineInventory # Nebula edit
  #   offState: off # Nebula edit
  #   normalState: normal-unshaded # Nebula edit
  # Nebula start
  - type: Sprite
    sprite: _Orion/Structures/Machines/VendingMachines/bitrun.rsi
    noRot: true
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: "normal-unshaded"
      map: ["enum.VendingMachineVisualLayers.Screen"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  # Nebula end
  - type: PointLight
    color: "#4f8dcf"
    autoRot: true
  - type: Transform
    noRot: false
  - type: Rotatable
    rotateWhileAnchored: false
    rotateWhilePulling: true
  - type: ShopVendor
    pack: BitrunningVendorInventory
    # Nebula start
    offState: off
    normalState: normal-unshaded
    # Nebula end
  - type: UserInterface
    interfaces:
      enum.VendingMachineUiKey.Key:
        type: ShopVendorBoundUserInterface
  - type: BitrunningPointsVendor

  id: EnergyDomeSmallRed
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Effects
    noRot: true
    sprite: _Orion/Effects/EnergyDome/energydome_small.rsi
    layers:
    - state: small
      color: "#b00000"
  - type: PointLight
    enabled: true
    radius: 5
    power: 2
    color: "#b00000"

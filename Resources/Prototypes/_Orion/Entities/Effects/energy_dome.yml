  - type: Damageable
    damageModifierSet: HardLightBarrier
  - type: AmbientSound
    volume: 35
    range: 5
    sound:
      path: /Audio/_Orion/Machines/Energy/energyshield_ambient.ogg
  - type: EnergyDome
  - type: Tag
    tags:
    - HideContextMenu
    - WideSwingIgnore

- type: entity

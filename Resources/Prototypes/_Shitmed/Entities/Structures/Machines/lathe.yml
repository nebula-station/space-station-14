- type: entity
  parent: BaseLathe
  id: MedicalBiofabricator
  name: medical biofabricator
  description: Produces organs and other organic matter that can be surgically grafted onto patients with biomass.
  components:
  # Nebula start
  - type: Sprite
    sprite: _Shitmed/Structures/Machines/limbgrower.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  # Nebula end
#    - state: limbgrower_idleoff
#      shader: unshaded
#      map: ["enum.PowerDeviceVisualLayers.Powered"]
#    - state: inserting
#      map: ["enum.MaterialStorageVisualLayers.Inserting"]
#    - state: panel
#      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: MedicalBiofabMachineBoard
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
  # Nebula start
  - type: Lathe
    idleState: icon
    runningState: building
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    staticPacks:
    - BiofabPartsStatic
  # Nebula end
  - type: EmagLatheRecipes
    emagStaticPacks:
    - BiofabPartsEmagStatic

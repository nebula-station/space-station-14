- type: entity
  abstract: true
  parent: BaseAugment
  id: BaseArmAugment
  components:
  - type: Sprite
    sprite: _Shitmed/Objects/Augments/arm.rsi
  - type: ChildOrgan
    parents: [ ArmLeft, ArmRight ]
  - type: Item
    size: Huge
  - type: Organ
    category: ArmAugment

# Tools

- type: entity
  parent: BaseAugmentAction
  id: ActionAugmentOpenToolsPanel
  name: Open tools panel
  description: Access the tools implanted within you
  components:
  - type: Sprite
    layers:
    - sprite: Clothing/Belt/utility.rsi
      state: icon
      map: [ "enum.ActionVisuals.Icon" ]
    - texture: Interface/Default/blocked.png
      visible: false
      map: [ "enum.ActionVisuals.IconToggled" ]

# Arm augment electronics

- type: entity
  abstract: true
  parent: BaseElectronics
  id: BaseAugmentElectronics
  components:
  - type: Sprite
    state: mainboard
  - type: Item
    storedRotation: 0
  - type: PhysicalComposition
    materialComposition:
      Glass: 100
      Steel: 100
    chemicalComposition:
      Silicon: 20

- type: entity
  parent: BaseAugmentElectronics
  id: AugmentStrengthElectronics
  name: strength augment electronics
  description: An electronics board that controls a strength augment.
  components:
  - type: Tag
    tags: [ AugmentStrengthElectronics ]

# Arm augment casings

# Strength

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseIncompleteAugmentStrength
  description: Can be implanted into a body to increase physical strength. This one is incomplete.
  components:
  - type: Sprite
    sprite: _Shitmed/Objects/Augments/arm.rsi
  - type: Item
    size: Huge
  - type: Construction
    graph: AugmentStrength

- type: entity
  parent: BaseIncompleteAugmentStrength
  id: AugmentStrengthCasing
  name: strength augment casing
  components:
  - type: Sprite
    state: base
  - type: Construction
    node: casing
  - type: Tag
    tags: [ AugmentStrengthCasing ]

- type: entity
  parent: BaseIncompleteAugmentStrength
  id: AugmentStrengthCables
  name: strength augment casing with cables
  components:
  - type: Sprite
    state: base_cables
  - type: Construction
    node: cables

- type: entity
  parent: BaseAugmentAction
  id: ActionAugmentToggleStrength
  name: Toggle strength augment
  description: Increases your melee damage by 25%, consumes 30W while active.
  components:
  - type: Sprite
    layers:
    - texture: Interface/Default/blocked.png
      map: [ "enum.ActionVisuals.Icon" ]
    - sprite: Objects/Tools/Toolboxes/toolbox_blue.rsi
      state: icon
      visible: false
      map: [ "enum.ActionVisuals.IconToggled" ]
  - type: InstantAction
    event: !type:ToggleActionEvent

- type: entity
  parent: BaseArmAugment
  id: AugmentStrength
  name: strength augment
  description: Can be implanted into a body to increase physical strength.
  components:
  # Nebula start
  - type: CyberwareHumanity
    cost: 2
  # Nebula end
  - type: Sprite
    state: strength
  - type: ItemToggle
    onUse: false
    onActivate: false
  - type: AugmentStrength
  - type: AugmentPowerDraw
    draw: 30
  - type: AugmentAction
    action: ActionAugmentToggleStrength
  - type: Construction
    graph: AugmentStrength
    node: augment

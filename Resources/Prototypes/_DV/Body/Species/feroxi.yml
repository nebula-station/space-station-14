- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceFeroxi
  categories: [ HideSpawnMenu ]
  name: feroxi appearance
  components:
  - type: Inventory
    speciesId: feroxi
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: jumpsuit-female
      shoes:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: shoes
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: jumpsuit
      shoes:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: shoes
  - type: InitialBody
    organs:
      Torso: OrganFeroxiTorso
      Head: OrganFeroxiHead
      Tail: OrganFeroxiTail
      ArmLeft: OrganFeroxiArmLeft
      ArmRight: OrganFeroxiArmRight
      HandRight: OrganFeroxiHandRight
      HandLeft: OrganFeroxiHandLeft
      LegLeft: OrganFeroxiLegLeft
      LegRight: OrganFeroxiLegRight
      FootLeft: OrganFeroxiFootLeft
      FootRight: OrganFeroxiFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganFeroxiLungs
      Heart: OrganAnimalHeart
      Stomach: OrganFeroxiStomach
      Liver: OrganAnimalLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Feroxi

- type: entity
  parent:
  - AppearanceFeroxi
  - BaseSpeciesMobOrganic
  id: MobFeroxi
  name: Urist McFin
  components:
  - type: Satiation
    satiations:
      Hunger:
        prototype: NormalSatiationHunger
      Thirst:
        prototype: FeroxiThirst
  - type: Speech
    speechSounds: Tenor
    speechVerb: Feroxi
    allowedEmotes: [ 'Gnash', 'Thump' ]
  - type: Vocal
    emoteSounds: MaleFeroxi
  - type: BodyEmotes
    soundsId: FeroxiBodyEmotes
  - type: MeleeWeapon
    hidden: true
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 30
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 7
  - type: TypingIndicator
    proto: feroxi
  - type: FeroxiDehydrate
    hydratedMetabolizer: Feroxi
    dehydratedMetabolizer: FeroxiDehydrated
    dehydrationThreshold: 150
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - Nehina
    understands:
    - TauCetiBasic
    - Nehina
  - type: CreamPied
    sprite:
      sprite: _DV/Effects/creampie.rsi
      state: creampie_feroxi
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - AnomalyHost
    - Feroxi

- type: entity
  parent: [ OrganBaseLungs, OrganHumanInternal ]
  id: OrganFeroxiLungs
  name: feroxian lungs and gills
  description: A pair of amphibious lungs along with gills, filtering oxygen out of the air and water alike.
  components:
  - type: Metabolizer
    metabolizerTypes: [ Feroxi ]

- type: entity
  parent: [ OrganBaseStomach, OrganAnimalInternal ]
  id: OrganFeroxiStomach
  name: feroxian stomach
  components:
  - type: Stomach
    specialDigestible:
      components:
      - BodyPart
      tags:
      - ReptilianFood
      - Meat
      - Pill
      - Crayon
      - Paper
  - type: Metabolizer
    metabolizerTypes: [ Feroxi, Animal ]


- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceHarpy
  categories: [ HideSpawnMenu ]
  name: harpy appearance
  components:
  - type: Inventory
    speciesId: harpy
    templateId: digitigrade
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _DV/Mobs/Species/Harpy/displacement.rsi
            state: jumpsuit
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _DV/Mobs/Species/Harpy/displacement.rsi
            state: jumpsuit
  - type: InitialBody
    organs:
      Torso: OrganHarpyTorso
      Head: OrganHarpyHead
      Tail: OrganHarpyTail
      ArmLeft: OrganHarpyArmLeft
      ArmRight: OrganHarpyArmRight
      HandRight: OrganHarpyHandRight
      HandLeft: OrganHarpyHandLeft
      LegLeft: OrganHarpyLegLeft
      LegRight: OrganHarpyLegRight
      FootLeft: OrganHarpyFootLeft
      FootRight: OrganHarpyFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Harpy

- type: entity
  parent:
  - AppearanceHarpy
  - BaseSpeciesMobOrganic
  id: MobHarpy
  name: Urist McHarpy
  components:
  - type: HarpySinger
    shutUpDamageThreshold: 5
  - type: Instrument
    allowPercussion: false
    program: 52
  - type: SwappableInstrument
    instrumentList:
      "Voice": {52: 0}
      "Trumpet": {56: 0}
      "Electric": {27: 0}
      "Bass": {33: 0}
      "Rock": {29: 0}
      "Acoustic": {24: 0}
      "Flute": {73: 0}
      "Sax": {66: 0}
      "Piano": {1: 0}
      "Church Organ": {19: 0}
      "Violin": {41: 0}
  - type: UserInterface
    interfaces:
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface
        requireInputValidation: false
  - type: Damageable
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    animation: WeaponArcClaw
    damage:
      types:
        Piercing: 5
  - type: Speech
    speechSounds: Harpy
    speechVerb: Harpy
    allowedEmotes: [ 'Chirp', 'Trill', 'Warble', 'Wurble', 'Mars', 'Squeak', 'Bagawk', 'Click', 'Flap', 'Gnash', 'Honk', 'Beep', 'Buzz', 'Squish', 'Bubble', 'Pop', 'Chitter' ]
  - type: Vocal
    emoteSounds: SoundsHarpyMale
  - type: MovementSpeedModifier
    weightlessAcceleration: 2.5
    weightlessModifier: 1.12
  - type: Sprinter
    staminaDrainRate: 23.4 # Nebula edit
  - type: StepTriggerImmune
    whitelist:
      types:
      - Shard
      - Landmine
      - Mousetrap
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - ValyrianStandard
    understands:
    - TauCetiBasic
    - ValyrianStandard
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
  # Nebula start
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  # Nebula end

- type: entity
  parent: OrganBaseOrganic
  id: OrganHarpy
  abstract: true
  suffix: harpy

- type: entity
  parent: OrganHarpy
  id: OrganHarpyExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _DV/Mobs/Species/Harpy/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _DV/Mobs/Species/Harpy/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Harpy

- type: entity
  id: OrganHarpyWing
  abstract: true
  components:
  - type: OrganComponents
    onAdd:
    - type: Flight
      isLayerAnimated: true
      layer: "/Textures/_EinsteinEngines/Mobs/Customization/Harpy/harpy_wings.rsi"
      animationKey: Flap
      speedModifier: 2.6
      staminaDrainRate: 8.5

- type: entity

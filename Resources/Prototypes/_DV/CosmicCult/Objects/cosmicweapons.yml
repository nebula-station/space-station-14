- type: entity
  name: entropic blade
  parent: [BaseSword, BaseCosmicContraband]
  id: SwordCosmicCult
  description: An eerie greatsword wrought of indescribable material, forcibly extruded down into reality. Your instincts tell you that it does not belong here.
  components:
  - type: CosmicEquipment
  - type: Sprite
    sprite: _DV/CosmicCult/Objects/cosmicsword.rsi
    layers:
      - state: icon
      - state: icon-overlay
        shader: unshaded
  - type: MeleeWeapon
    angle: 90
    animation: WeaponArcCosmic
    attackRate: 1
    # Nebula start
    damage:
      types:
        Slash: 10
        Cold: 2.5
        Asphyxiation: 2.5
        Structural: 15
        Ion: 25
    # Nebula end
    soundHit:
      path: /Audio/_DV/CosmicCult/cosmicsword_hit.ogg
      params:
        variation: 0.2
        volume: 1
    soundSwing:
      path: /Audio/_DV/CosmicCult/cosmicweapon_swing.ogg
      params:
        variation: 0.125
        volume: -4
    soundNoDamage:
      path: /Audio/_DV/CosmicCult/cosmicsword_glance.ogg
      params:
        variation: 0.2
        volume: -1
    clickDamageModifier: 1.1 # Nebula
    resistanceBypass: true # Nebula
  - type: DisarmMalus
  - type: Item
    size: Large
    shape:
    - 0,0,1,3
    storedRotation: -45
    sprite: _DV/CosmicCult/Objects/cosmicsword-inhands.rsi
  - type: UnholyItem # Goobstation Shitchap
  - type: CosmicTransmutable
    transmuteTo: null # No reforging
  - type: Parry
    soundOnReflect:
      path: /Audio/_DV/CosmicCult/cosmicsword_glance.ogg
      params:
        variation: 0.2
        volume: -1
    soundOnParry:
      path: /Audio/_DV/CosmicCult/cosmicsword_glance.ogg
      params:
        variation: 0.2
        volume: -1
  # Nebula start
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 5
        Cold: 2.5
        Asphyxiation: 2.5
        Structural: 5
  - type: Reflect
    reflectProb: .21
    soundOnReflect:
      path: /Audio/_DV/CosmicCult/cosmicsword_glance.ogg
      params:
        variation: 0.2
        volume: -6
    spread: 120
  # Nebula end

- type: entity
  name: vacuous lance
  parent: [BaseItem, BaseCosmicContraband]
  id: SpearCosmicCult
  description: An unnerving spear, wrought of indescribable material. Being near it feels like a prickle of static spreading through your nerves.
  components:
  - type: WeaponClass
    class: Polearm
  - type: CosmicEquipment
  - type: Sprite
    sprite: _DV/CosmicCult/Objects/cosmiclance.rsi
    layers:
      - state: icon
      - state: icon-overlay
        shader: unshaded
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcCosmic
    attackRate: 0.62 # Nebula
    # Nebula start
    damage:
      types:
        Piercing: 15
        Cold: 5
        Asphyxiation: 5
        Ion: 25
    # Nebula end
    animationRotation: 225
    wideAnimationRotation: 225
    soundHit:
      path: /Audio/_DV/CosmicCult/cosmiclance_hit.ogg
      params:
        variation: 0.2
        volume: 1
    soundSwing:
      path: /Audio/_DV/CosmicCult/cosmicweapon_swing.ogg
      params:
        variation: 0.125
        volume: -4
    soundNoDamage:
      path: /Audio/_DV/CosmicCult/cosmicsword_glance.ogg
      params:
        variation: 0.2
        volume: -1
    resistanceBypass: true # Nebula
  - type: DamageOtherOnHit
    # Nebula start
    damage:
      types:
        Piercing: 5
        Cold: 5
        Asphyxiation: 5
        Ion: 17.5
    # Nebula end
  - type: EmbeddableProjectile
    removalTime: 2
    sound: /Audio/_DV/CosmicCult/cosmiclance_impact.ogg
  - type: Wieldable
    wieldSound:
      path: /Audio/_DV/CosmicCult/cosmic_wield.ogg
      params:
        variation: 0.2
        volume: -2
    unwieldSound:
      path: /Audio/_DV/CosmicCult/cosmic_unwield.ogg
      params:
        variation: 0.2
        volume: 0
  - type: IncreaseDamageOnWield
    # Nebula start
    damage:
      types:
        Piercing: 10
        Cold: 2.5
        Asphyxiation: 2.5
    # Nebula end
  - type: Item
    size: Large
    shape:
    - 0,0,5,0
    storedRotation: 45
    sprite: _DV/CosmicCult/Objects/cosmiclance-inhands.rsi
  - type: EmitSoundOnThrow
    sound: /Audio/_DV/CosmicCult/cosmicweapon_swing.ogg ## THROWING SOUND - REPLACE THIS!
  - type: ThrowingAngle
    angle: 225
  - type: LandAtCursor
  - type: Tag
    tags:
    - Spear
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
            - -0.40,-0.30
            - -0.30,-0.40
            - 0.40,0.30
            - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: UnholyItem # Goobstation Shitchap
  - type: Execution
    doAfterDuration: 4.0

- type: entity
  parent: [BaseItem, BaseCosmicContraband]
  name: astral razor
  id: ScytheCosmicCult
  description: An preternatural scythe, wrought of indescribable material. Even just looking at it makes you feel cold.
  components:
  - type: WeaponClass
    class: Tool
  - type: Sharp
  - type: CosmicEquipment
  - type: Sprite
    sprite: _DV/CosmicCult/Objects/cosmicscythe.rsi
    layers:
      - state: icon
      - state: icon-overlay
        shader: unshaded
  - type: UseDelayOnShoot
  - type: UseDelay
    delay: 2 # Nebula
  - type: LeechOnMarker
    leech:
      types:
        Blunt: -20
        Slash: -20
        Piercing: -20
        Heat: -20
        Cold: -20
        Shock: -20
        Caustic: -20
  - type: Gun
    projectileSpeed: 10 # Nebula
    soundGunshot: /Audio/_DV/CosmicCult/projectile_razor.ogg
    fireRate: 1.5 # Nebula
  - type: AltFireMelee
    attackType: Heavy
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1
    rechargeSound:
      path: /Audio/_DV/CosmicCult/projectile_razor_reload.ogg
  - type: BasicEntityAmmoProvider
    proto: ProjectileCosmicRazor
    capacity: 1
    count: 1
  - type: MeleeWeapon
    wideAnimationRotation: -135
    animation: WeaponArcCosmic
    attackRate: 1.5 # Nebula
    # Nebula start
    damage:
      types:
        Slash: 6
        Cold: 2
        Asphyxiation: 2
        Ion: 6
        Structural: 15
    # Nebula end
    soundHit:
      path: /Audio/_DV/CosmicCult/cosmicsword_hit.ogg
      params:
        variation: 0.2
        volume: 1
    soundSwing:
      path: /Audio/_DV/CosmicCult/cosmicweapon_swing.ogg
      params:
        variation: 0.125
        volume: -4
    soundNoDamage:
      path: /Audio/_DV/CosmicCult/cosmicsword_glance.ogg
      params:
        variation: 0.2
        volume: -11
    clickDamageModifier: 1.1 # Nebula
    resistanceBypass: true # Nebula
  - type: Wieldable
    wieldSound:
      path: /Audio/_DV/CosmicCult/cosmic_wield.ogg
      params:
        variation: 0.2
        volume: -2
    unwieldSound:
      path: /Audio/_DV/CosmicCult/cosmic_unwield.ogg
      params:
        variation: 0.2
        volume: 0
  - type: GunRequiresWield
  - type: Item
    size: Ginormous
    sprite: _DV/CosmicCult/Objects/cosmicscythe-inhands.rsi
  - type: Clothing
    sprite: _DV/CosmicCult/Objects/cosmicscythe-inhands.rsi
    slots:
    - Back
    - suitStorage
  - type: UnholyItem
  - type: Tool
    qualities:
    - Slicing
    useSound:
      path: /Audio/Items/Culinary/chop.ogg
  - type: Execution
    doAfterDuration: 4.0
    decapitation: true
  - type: Parry
    reflectExhaustionCost: 0.25
    soundOnReflect:
      path: /Audio/_DV/CosmicCult/cosmicsword_glance.ogg
      params:
        variation: 0.2
        volume: -1
    soundOnParry:
      path: /Audio/_DV/CosmicCult/cosmicsword_glance.ogg
      params:
        variation: 0.2
        volume: -1
  # Nebula start
  - type: IncreaseDamageOnWield
    damage:
      types:
        Structural: 5
  # Nebula end

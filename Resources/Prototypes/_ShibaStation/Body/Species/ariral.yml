    sprite: _ShibaStation/Mobs/Species/Ariral/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _ShibaStation/Mobs/Species/Ariral/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Ariral

- type: entity
  id: OrganAriralMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Ariral, Human ]

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorsoTailed, OrganAriralExternal ]

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceAriral
  categories: [ HideSpawnMenu ]
  name: ariral appearance
  components:
  - type: Inventory
    speciesId: reptilian
    # Nebula - displacement maps ported from Monolith
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _LuaM/Mobs/Species/Ariral/displacement.rsi
            state: jumpsuit-female
      shoes:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: shoes
      outerClothing:
        sizeMaps:
          32:
            sprite: _LuaM/Mobs/Species/Ariral/displacement.rsi
            state: outerClothing
      head:
        sizeMaps:
          32:
            sprite: _LuaM/Mobs/Species/Ariral/displacement.rsi
            state: head
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _LuaM/Mobs/Species/Ariral/displacement.rsi
            state: jumpsuit
      shoes:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: shoes
      outerClothing:
        sizeMaps:
          32:
            sprite: _LuaM/Mobs/Species/Ariral/displacement.rsi
            state: outerClothing
      head:
        sizeMaps:
          32:
            sprite: _LuaM/Mobs/Species/Ariral/displacement.rsi
            state: head
  - type: InitialBody
    organs:
      Torso: OrganAriralTorso
      Head: OrganAriralHead
      Tail: OrganAriralTail
      ArmLeft: OrganAriralArmLeft
      ArmRight: OrganAriralArmRight
      HandRight: OrganAriralHandRight
      HandLeft: OrganAriralHandLeft
      LegLeft: OrganAriralLegLeft
      LegRight: OrganAriralLegRight
      FootLeft: OrganAriralFootLeft
      FootRight: OrganAriralFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganAriralLungs
      Heart: OrganAriralHeart
      Stomach: OrganAriralStomach
      Liver: OrganAriralLiver
      Kidneys: OrganAriralKidneys
  - type: HumanoidProfile
    species: Ariral

- type: entity
  parent:
  - AppearanceAriral
  - BaseSpeciesMobOrganic
  id: MobAriral
  name: Urist McArir
  components:
  - type: Speech
    speechVerb: Ariral
    allowedEmotes: [ "Meow", "Purr", "Hiss" ]
  - type: Damageable
    damageModifierSet: Ariral
  - type: Stamina
    baseCritThreshold: 75
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: AriralBlood
        Quantity: 300
    bloodRefreshAmount: 0.85
    bleedReductionAmount: 0.25
    damageBleedModifiers: BloodlossAriral
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    animation: WeaponArcFist
    damage:
      types:
        Blunt: 3
  - type: SolutionManager
    solutions:
    - SolutionAriralSkin
  - type: MeleeChemicalInjector
    solution: melee
    transferAmount: 1
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - Ariral
    understands:
    - TauCetiBasic
    - Ariral
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5

- type: entity
  parent: [ SolutionWeapon, SolutionTiny ]
  id: SolutionAriralSkin
  categories: [ HideSpawnMenu ]
  components:
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: AriralSweat
        Quantity: 0.5

- type: entity
  parent: OrganBaseOrganic
  id: OrganAriral
  abstract: true
  suffix: ariral

- type: entity
  parent: OrganAriral
  id: OrganAriralExternal
  abstract: true
  components:

- type: entity
  name: pickaxe
  parent: [ BaseItem, BaseSalvageContraband ] # Trauma - Contraband tag
  id: Pickaxe
  description: Notched to perfection, for jamming it into rocks.
  components:
  # <Trauma>
  - type: WeaponClass
    class: Mining
  # </Trauma>
  - type: Tag
    tags:
    - Pickaxe
    - ItemPickaxe # Einstein Engines
  - type: Sprite
    sprite: Objects/Weapons/Melee/pickaxe.rsi
    state: pickaxe
  - type: MeleeWeapon
    heavyStaminaCost: 0 # Nebula
    attackRate: 0.7
    animationRotation: -45 # WWDP
    wideAnimationRotation: -135
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
      params:
        volume: -3
    # Nebula start
    damage:
      types:
        Blunt: 1.67
        Slash: 1.67
        Piercing: 1.67
    # Nebula end
  - type: Wieldable
  - type: IncreaseDamageOnWield
    # Nebula start
    damage:
      types:
        Structural: 30
        Blunt: 3.33
        Slash: 3.33
        Piercing: 3.33
    # Nebula end
  - type: Item
    size: Normal
    shape:
    - 0,0,2,0
    - 1,1,1,2
    sprite: Objects/Weapons/Melee/pickaxe.rsi
    storedRotation: -45
  - type: UseDelay
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 250
      Wood: 125

- type: entity
  name: mining drill
  parent: [ BaseItem, BaseSalvageContraband ] # Trauma - contraband tag
  id: MiningDrill
  description: Powerful tool used to quickly drill through rocks.
  components:
  # <Trauma>
  - type: WeaponClass
    class: Mining
  - type: PhysicalComposition
    materialComposition:
      Steel: 125
      Plastic: 25
  # </Trauma>
  - type: Item
    storedRotation: -90
  - type: Tag
    tags:
    - Pickaxe
  - type: Sprite
    sprite: Objects/Tools/handdrill.rsi
    state: handdrill
  - type: MeleeWeapon
    # <Trauma>
    animationRotation: -90
    heavyStaminaCost: 0 # Mining drill is for mining
    # </Trauma>
    autoAttack: true
    angle: 0
    wideAnimationRotation: -90
    soundHit:
      path: "/Audio/Items/drill_hit.ogg"
    attackRate: 4
    # Nebula start
    damage:
      types:
        Structural: 15
        Blunt: 1
        Slash: 1
        Piercing: 1
    # Nebula end

- type: entity
  name: diamond tipped mining drill
  parent: MiningDrill
  id: MiningDrillDiamond
  description: A significantly more efficient mining drill tipped with diamond.
  components:
  - type: Sprite
    sprite: Objects/Tools/handdrilldiamond.rsi
    state: handdrill
  - type: MeleeWeapon
    autoAttack: true
    angle: 0
    animationRotation: -90 # WWDP
    wideAnimationRotation: -90
    soundHit:
      path: "/Audio/Items/drill_hit.ogg"
    attackRate: 4
    # Nebula start
    damage:
      types:
        Structural: 31
        Blunt: 2
        Slash: 2
        Piercing: 2
    # Nebula end
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 150
      Plastic: 50
      Silver: 50
      Diamond: 25


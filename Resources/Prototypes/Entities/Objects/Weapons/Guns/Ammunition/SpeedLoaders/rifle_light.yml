- type: entity
  parent: [ BaseItem, BaseSecurityContraband ]
  id: SpeedLoaderLightRifle
  name: "speed loader (7.62mm rifle)" # Orion edit
  description: 5-round 'stripper clip' for quickly reloading the Kardashev-Mosin. Intended to hold general-purpose kinetic ammunition.
  components:
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    fillDelay: 0.1 # Orion edit
    mayTransfer: true
    whitelist:
      tags:
      - CartridgeRifle762 # Orion edit
    capacity: 10 # Nebula
    proto: CartridgeRifle762 # Nebula
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/LightRifle/light_rifle_speed_loader.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-5
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: false
  - type: Appearance
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []

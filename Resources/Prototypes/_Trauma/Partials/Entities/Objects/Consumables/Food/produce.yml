- type: entity
  id: FoodProduceBase
  components: [] # Nebula edit

- type: entity
  id: RiceBushel
  components:
  - type: Tag
    tags:
    - Ruminant
    - Rice

- type: entity
  id: FoodMimana
  components:
  - type: Tag
    tags:
    - Mimana

- type: entity
  id: Log
  components:
  - type: PhysicalComposition
    materialComposition:
      Wood: 500
  - type: StaticPrice
    price: 50
  - type: ToolRefinable
    refineResult: !Clear
    - id: MaterialWoodPlank1
      amount: 5 # was 2

- type: entity
  id: SteelLog
  components:
  - type: PhysicalComposition
    materialComposition:
      Steel: 500 # 5 sheets
  - type: StaticPrice
    price: 75
  - type: ToolRefinable
    refineResult: !Clear
    - id: SheetSteel1
      amount: 5 # was 1

- type: entity
  id: DeathNettle
  parent: !Clear [ProduceBase, BaseMajorContraband, DeathNettleDurability]
  components:
  - type: Item
    shape:
    - 0,1,0,2
    - 1,0,1,1
    storedRotation: 90
  - type: MeleeWeapon
    damage: !Clear
      types:
        # Nebula start
        Heat: 8
        Caustic: 8
        # Nebula end
  - !Remove type: Destructible # replaced by durability

- type: entity
  id: FoodBanana
  components:
  - type: EntityEffectOnEaten
    effects:
    - !type:AddComponents
      components:
      - type: EggFertilizer
        specialReplacement: MobChickClown
    entityWhitelist:
    - MobWhiteRooster
  - type: Healing # Bananas heal clown car
    damageContainers:
    - ClowncarDamageContainer
    damage:
      types:
        Blunt: -50
        Slash: -50
        Piercing: -50
        # Nebula edit
        Heat: -10
        Shock: -10
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"

- type: entity
  id: TrashBananaPeel
  components:
  - type: StepTrigger
    triggerGroups:
      types: [ SlipEntity ]
  - type: Tag
    tags:
    - RotHulkTrash

- type: entity
  id: TrashBananiumPeel

- type: entity
  abstract: true
  parent: BaseStockHit
  id: BaseWeaponSubMachineGun
  components:
  - type: WeaponClass
    class: SMG
  - type: EmitSoundOnPickup
    sound:
      collection: SMGPickUp
  - type: EmitSoundOnDrop
    sound: &smg_drop
      collection: SMGDrop
  - type: EmitSoundOnLand
    sound: *smg_drop
  - type: AltFireMelee
    attackType: Heavy
  - type: MeleeWeapon
    damage:
      types:
       Blunt: 10 # lower melee damage for SMGs as they are lighter

- type: entity
  id: WeaponSubMachineGunC20r
  components:
  - !Remove type: Wieldable # 1 handed c20r
  - !Remove type: GunWieldBonus
  - type: Gun
  - type: Item
    shape:
    - 0,0,2,1

- type: entity
  id: WeaponSubMachineGunDrozd
  components:
  - type: Gun

- type: entity
  id: WeaponSubMachineGunWt550
  name: WT550 autorifle
  description: A truly unique firearm, the WT550 was designed by Nanotrasen's Small Arms Division as a compact, cheap, and mass produced submachine gun fully controllable with one hand. It contains an exotic internal recoil buffer and feeds from special top-mounted 9mm magazines.
  components:
  - type: Gun
  - type: Item
    shape:
    - 0,0,2,1

- type: entity
  id: WeaponSubMachineGunBriefcase
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Weapons/Guns/SMGs/briefcase_brown.rsi
  - type: Gun

- type: entity
  abstract: true
  id: BaseShield
  components:
  - type: WeaponClass
    class: Shield
  - type: DisarmMalus
    malus: 1
  - type: CosmicTransmutable
    transmuteTo: CosmicCultShield
  - type: Parry
    parryExhaustionCost: 0.25
    soundOnParry:
      path: /Audio/Weapons/block_metal1.ogg
      params:
        variation: 0.2
        volume: -11
    soundOnReflect:
      path: /Audio/Weapons/Guns/Hits/ric4.ogg
      params:
        variation: 0.2
        volume: -11
  - type: MeleeWeapon
    wideAnimationRotation: -135
    soundHit:
      collection: MetalThud
    animation: WeaponArcFist
  - type: FlashSoundSuppression
    protectionRange: 2
  - type: MeleeThrowOnHit
    distance: 0.5
    speed: 2
  - type: Blocking

- type: entity
  abstract: true
  id: BaseRepairableShield
  components:
  - type: Repairable
    damage:
      types:
        Piercing: -20 # Nebula

- type: entity
  id: RiotShield
  components:
  - type: MeleeWeapon
  - type: FlashSoundSuppression
    protectionRange: 1
  - type: MeleeThrowOnHit
    distance: 1
  - type: Blocking

- type: entity
  id: RiotLaserShield
  components:
  - type: Parry
    parryExhaustionCost: 1.1
    reflectExhaustionCost: 0.25
    soundOnReflect:
      path: /Audio/Weapons/Guns/Hits/laser_sear_wall.ogg
    reflectSpread: 300
    reflects:
    - Energy
  - type: FlashSoundSuppression
    protectionRange: 1
  - type: Blocking

- type: entity
  id: RiotBulletShield
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Shields/riotbulletshield.rsi
    state: ballistic-icon
  - type: Item
    sprite: _Goobstation/Objects/Shields/riotbulletshield.rsi
    heldPrefix: ballistic
  - type: MeleeWeapon
  - type: MeleeThrowOnHit
    distance: 1
  - type: Blocking

- type: entity
  id: WoodenBuckler
  components:
  - type: Parry
    parryExhaustionCost: 0.5
  - type: MeleeWeapon
  - type: FlashSoundSuppression
    protectionRange: 3

- type: entity
  id: CardShield
  components:
  - type: Parry
    parryExhaustionCost: 1
    parryMinSkill: 0
    reflectMinSkill: 0
    soundOnParry:
      path: /Audio/Items/Toys/card_tube_bonk.ogg
  - type: PhysicalComposition
    materialComposition:
      Cardboard: 300
  - type: Tag
    tags:
    - Trash
  - type: MeleeWeapon
  - type: Blocking

- type: entity
  id: MakeshiftShield
  components:
  - type: Parry
    parryExhaustionCost: 0.5
  - type: PhysicalComposition
    materialComposition:
      Steel: 250
  - type: MeleeWeapon
  - type: Tag
    tags:
     - MakeshiftShield
     - Trash

- type: entity
  id: WebShield
  components:
  - type: Parry
    parryExhaustionCost: 1
    soundOnParry:
      path: /Audio/Weapons/slash.ogg
  - type: MeleeWeapon
  - type: FlashSoundSuppression
    protectionRange: 3

- type: entity
  id: ClockworkShield
  components:
  - type: MeleeWeapon
  - type: ReflectiveSurface

- type: entity
  id: MirrorShield
  categories: [ HideSpawnMenu ] # it isn't the real cult one
  components:
  - type: Parry
    parryExhaustionCost: 1.1
    reflectExhaustionCost: 0.05
    reflectMinSkill: 0
    soundOnReflect:
      path: /Audio/Weapons/Guns/Hits/laser_sear_wall.ogg
    reflectSpread: 300
    reflects:
      - Energy
  - type: MeleeWeapon
  - !Remove type: Reflect

- type: entity
  id: EnergyShield
  components:
  - type: CosmicTransmutable
    transmuteTo: CosmicCultShield
  - type: MeleeWeapon
    attackRate: 1
    damage:
      types:
        Heat: 10
  - type: Battery
    maxCharge: 35
    startingCharge: 35
  - type: BatterySelfRecharger
    autoRechargeRate: 2
  - type: RechargeableBlocking
    rechargePercentage: 0.9
    dischargedRechargeRate: 1.5
    chargedRechargeRate: 2
  - type: ItemToggle
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.250
  - type: ComponentToggler
    components: !Clear
    - type: Parry
      parryExhaustionCost: 0.25
    - type: DisarmMalus
      malus: 1
  - type: PointLight
    energy: 0.7
    color: "#678AD9"
  - type: Reflect
    reflectProb: 1
    damageOnReflectModifier: 1

- type: entity
  id: TelescopicShield
  components:
  - type: MeleeWeapon

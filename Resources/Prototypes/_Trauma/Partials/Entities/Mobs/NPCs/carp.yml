- type: entity
  abstract: true
  id: BaseMobCarp
  components:
  - type: AshStormImmune
  - type: VentCrawler
  - type: Fauna
  - type: MobThresholds
  - type: MovementSpeedModifier
    baseSprintSpeed: 4.5 # was 3.5, Can catch up to people
  - !Remove type: ReplacementAccent
  - type: LanguageSpeaker
    speaks:
    - Carptongue
    understands:
    - TauCetiBasic
    - Carptongue

- type: entity
  id: MobCarpMagic
  components:
  - type: Damageable

- type: entity
  id: MobCarpHolo
  components:
  - type: Damageable

- type: entity
  id: MobCarpSalvage
  components:
  - !Remove type: MobThresholds

- type: entity
  id: MobShark
  components:
  - type: MobThresholds
    thresholds: !Clear
      0: Alive
      150: Dead # was 100

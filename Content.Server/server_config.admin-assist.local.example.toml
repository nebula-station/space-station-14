[net]
port = 1212
upnp = false

[game]
hostname = "Admin Assist Local Test"

[auth]
mode = 0

[console]
loginlocal = true

[database]
engine = "postgres"
pg_host = "127.0.0.1"
pg_port = 55432
pg_username = "ss14"
pg_password = "local_game"
pg_database = "ss14_playtest"

[adminlogs]
server_name = "unknown"

[nebula]
isolate_records = false

# Сайдкар (Tools/_Nebula/admin_assist) читает этот же файл: uv run python -m admin_assist --config <путь>.
[admin_assist]
ingame_briefings = true
ahelp_persist = true
# На боевом сервере true: сервер сам запускает сайдкар. Здесь его запускает runlocal.sh.
sidecar = false
# Общий для игры и сайдкара. Никогда не коммитьте настоящие ключи.
round_state_token = "<openssl rand -hex 32>"
round_state_url = "http://127.0.0.1:1212/admin_assist/round_state"
round_state_timeout_s = 3

game_dsn = "postgresql://admin_assist_ro:local_ro@127.0.0.1:55432/ss14_playtest"
own_dsn = "postgresql://admin_assist_rw:local_rw@127.0.0.1:55432/ss14_playtest"
db_statement_timeout_ms = 5000

kidmesh_base_url = "https://api.kidmesh.best/v1"

name: Admin Assist Tests

on:
  workflow_dispatch:
  push:
    branches: [master, staging, stable]
    paths:
      - "Tools/_Nebula/admin_assist/**"
      - "Content.Server.Database/Migrations/Postgres/**"
      - ".github/workflows/admin-assist-tests.yml"
  merge_group:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [master, staging, stable]
    paths:
      - "Tools/_Nebula/admin_assist/**"
      - "Content.Server.Database/Migrations/Postgres/**"
      - ".github/workflows/admin-assist-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: Admin Assist Tests
    if: github.actor != vars.CHANGELOG_BOT && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tools/_Nebula/admin_assist

    steps:
      - name: Checkout Master
        uses: actions/checkout@v7.0.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: Tools/_Nebula/admin_assist/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Start Postgres
        run: docker compose up -d --wait

      - name: Run pytest
        run: |
          uv run --locked pytest -rs | tee pytest.log
          ! grep -q "local Postgres not reachable" pytest.log

      - name: Postgres logs
        if: failure()
        run: docker compose logs db

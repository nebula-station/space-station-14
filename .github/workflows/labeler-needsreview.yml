name: "Labels: Needs Review"

on:
  pull_request_target:
    types: [review_requested]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  needs_review:
    if: >
      github.repository == 'nebula-station/space-station-14' &&
      github.event.pull_request.user.login != vars.CHANGELOG_BOT &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR as needing review
        uses: step-security/action-add-labels@v1.1.1
        with:
          number: ${{ github.event.pull_request.number }}
          labels: "Needs Review"

      - name: Remove stale review state labels
        uses: step-security/action-remove-labels@v1.3.1
        with:
          number: ${{ github.event.pull_request.number }}
          labels: |
            Awaiting Changes
            Approved

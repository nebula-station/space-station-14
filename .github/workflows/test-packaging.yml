name: Test Packaging

on:
  push:
    branches: [master, staging, stable]
    paths:
      - "**.cs"
      - "**.csproj"
      - "**.sln"
      - "**.git**"
      - "**.yml"
      # no docs on which one of these is supposed to work, so
      # why not just do both
      - "RobustToolbox"
      - "RobustToolbox/**"
  merge_group:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [master, staging, stable]
    paths:
      - "**.cs"
      - "**.csproj"
      - "**.sln"
      - "**.git**"
      - "**.yml"
      - "RobustToolbox"
      - "RobustToolbox/**"

jobs:
  build:
    name: Test Packaging
    if: github.actor != vars.CHANGELOG_BOT && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Master
        uses: actions/checkout@v7.0.0

      - name: Setup Submodule
        run: |
          git submodule update --init --recursive

      - name: Pull engine updates
        uses: Trauma-Station/submodule-dependency@v0.2.2
        with:
          map: |
            {
              "QuietToolbox": "RobustToolbox"
            }

      - name: Update Engine Submodules
        run: |
          cd RobustToolbox/
          git submodule update --init --recursive

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore

      - name: Build Packaging
        run: dotnet build Content.Packaging --configuration Release --no-restore /m

      - name: Package server
        # Nebula edit: publish.yml only ships linux-x64
        run: dotnet run --project Content.Packaging server --log-build --platform linux-x64

      - name: Package client
        run: dotnet run --project Content.Packaging client --log-build --no-wipe-release

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: binlogs
          path: release/*.binlog
          retention-days: 7

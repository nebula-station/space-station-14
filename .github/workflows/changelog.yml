name: PR Changelogs
concurrency: commit_action
on:
  pull_request_target:
    types: [closed]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CHANGELOG_DIR: Resources/Changelog/Nebula.yml
  PR_NUMBER: ${{ github.event.number }}

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
    steps:
      - name: Checkout Master
        # Nebula edit: v5 is Node 24, while v6 includeIf credentials broke auth here.
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: master

      - name: Setup Git
        run: |
          git config --global user.name "${{ vars.CHANGELOG_USER }}"
          git config --global user.email "${{ vars.CHANGELOG_EMAIL }}"
        shell: bash

      - name: Setup Node
        # Nebula edit: keep the workflow on a supported action runtime.
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 18.x

      - name: Install Dependencies
        run: |
          cd "Tools/_NF/changelog"
          npm install
        shell: bash

      - name: Generate Changelog
        run: |
          cd "Tools/_NF/changelog"
          node changelog.js
        shell: bash

      - name: Commit Changelog
        run: |
          # Nebula edit: commit generated changelog changes before rebasing, otherwise pull fails on a dirty tree.
          # PRs without a changelog may leave no file to add.
          if [ ! -e "$CHANGELOG_DIR" ]; then
            echo "No changelog file at $CHANGELOG_DIR, nothing to commit."
            exit 0
          fi
          git add "$CHANGELOG_DIR"
          if git diff --cached --quiet; then
            echo "No changelog changes to commit."
            exit 0
          fi
          git commit -m "${{ vars.CHANGELOG_MESSAGE }} (#${{ env.PR_NUMBER }})"
          git pull --rebase origin master
          git push
        shell: bash

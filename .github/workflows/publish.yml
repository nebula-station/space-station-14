name: Publish

concurrency:
  group: publish
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      publish_changelog:
        description: Post the changelog to Discord after publishing
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      engine_version: ${{ steps.engine.outputs.version }}

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          submodules: "recursive"
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: 10.0.x

      - name: Fetch engine metadata
        id: engine
        run: |
          cd RobustToolbox
          git fetch --depth=1
          tag=$(git describe --tags --abbrev=0)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build Packaging
        run: dotnet build Content.Packaging --configuration Release --no-restore /m

      - name: Package server
        run: dotnet run --project Content.Packaging server --platform linux-x64 # only linux, no: --platform win-x64 --platform osx-x64 --platform linux-arm64

      - name: Package client
        run: dotnet run --project Content.Packaging client --no-wipe-release

      - name: Upload release
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release
          path: release/
          retention-days: 7
          compression-level: 0 # already zipped

  publish-cdn:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Install system dependencies
        run: sudo apt-get install -y python3-requests

      - uses: actions/checkout@v7.0.0

      - name: Download release
        uses: actions/download-artifact@v8.0.1
        with:
          name: release
          path: release/

      - name: Publish version
        run: Tools/publish_multi_request.py
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          ENGINE_VERSION: ${{ needs.build.outputs.engine_version }}

  publish-changelog:
    needs: publish-cdn
    if: ${{ inputs.publish_changelog }}
    runs-on: ubuntu-latest

    steps:
      - name: Install system dependencies
        run: sudo apt-get install -y python3-requests python3-yaml

      - uses: actions/checkout@v7.0.0

      - name: Publish changelog (Discord)
        run: Tools/actions_changelogs_since_last_run.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}
